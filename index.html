<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comptage par zones</title>
<script src="xlsx.full.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#E8ECF0; --surface:#FFFFFF; --ink:#18222E; --muted:#5B6878; --line:#CBD3DC;
  --tag:#FFD23F; --tagInk:#1E1C10; --act:#1F5FBF; --actInk:#FFFFFF; --ok:#2B7A4B; --bad:#B8322A; --key:#F4F6F8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B222B; --surface:#25303B; --ink:#E7ECF1; --muted:#9AA7B5; --line:#3A4754;
    --act:#4C8DF0; --actInk:#FFFFFF; --ok:#52B57D; --bad:#E2655C; --key:#2D3946; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B222B; --surface:#25303B; --ink:#E7ECF1; --muted:#9AA7B5; --line:#3A4754;
  --act:#4C8DF0; --actInk:#FFFFFF; --ok:#52B57D; --bad:#E2655C; --key:#2D3946; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:10px;gap:8px}

/* Zone tag: the hang tag stuck on each fixture */
.top{display:flex;gap:10px;align-items:stretch}
.tag{position:relative;background:var(--tag);color:var(--tagInk);border-radius:6px 18px 18px 6px;
  padding:6px 16px 6px 30px;min-width:140px;display:flex;flex-direction:column;justify-content:center;border:0;text-align:left}
.tag::before{content:"";position:absolute;left:10px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.tag small{font-size:13px;font-weight:600;opacity:.75}
.tag strong{font-size:40px;line-height:1;font-weight:700;letter-spacing:.5px}
.tag.empty strong{font-size:22px;line-height:1.15}
.stats{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.stats .big{font-size:26px;font-weight:700;line-height:1}
.stats .small{color:var(--muted);font-size:14px}
.topbtns{display:flex;flex-direction:column;gap:6px}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600;font-size:15px}

.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:0 2px;min-height:22px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.status.off .dot{background:var(--bad)}
.status.off{color:var(--bad);font-weight:600}

.flash{min-height:30px;border-radius:8px;padding:4px 10px;font-weight:600;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line)}
.flash.ok{border-color:var(--ok);color:var(--ok)}
.flash.bad{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.flash.zone{border-color:var(--tag);background:color-mix(in srgb,var(--tag) 22%,var(--surface))}

.list{flex:1;min-height:80px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row:last-child{border-bottom:0}
.row .code{flex:1;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .q{font-size:24px;font-weight:700;min-width:48px;text-align:right}
.row.latest{box-shadow:inset 5px 0 0 var(--tag);background:color-mix(in srgb,var(--tag) 10%,var(--surface))}
.emptymsg{padding:18px 14px;color:var(--muted);line-height:1.4}

.qty{display:flex;align-items:baseline;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.qty .lbl{font-size:15px;color:var(--muted)}
.qty .val{font-size:40px;font-weight:700;line-height:1.1;color:var(--muted)}
.qty.set{border-color:var(--act)}
.qty.set .val{color:var(--act)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{background:var(--key);border:1px solid var(--line);border-radius:10px;height:clamp(44px,7vh,60px);font-size:28px;font-weight:600}
.pad button:active{background:var(--line)}
.pad .fn{font-size:16px;font-family:"Barlow",system-ui,sans-serif}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#closeZoneBtn{border-color:var(--tag)!important;background:color-mix(in srgb,var(--tag) 25%,var(--surface))!important}
.errsheet{border-top:6px solid var(--bad)}
.errsheet h2{color:var(--bad);font-size:26px}
.errsheet .btn{font-size:20px;padding:16px}
.actions button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px;line-height:1.15}

.manual{display:flex;gap:6px}
.manual input{flex:1;min-width:0;font:inherit;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:22px;padding:8px 12px;border-radius:10px;border:1px dashed var(--muted);background:var(--surface);color:var(--ink);user-select:text;-webkit-user-select:text}
.manual input:focus{outline:none;border:2px solid var(--act)}
.manual input::placeholder{color:var(--muted);font-family:"Barlow",system-ui,sans-serif;font-size:16px}
.manual button{background:var(--act);color:var(--actInk);border:0;border-radius:10px;padding:0 16px;font-weight:600;font-size:16px}
.row .src{font-size:12px;font-weight:600;color:var(--act);border:1px solid var(--act);border-radius:5px;padding:1px 5px}
.status.typing{color:var(--act);font-weight:600}
.pph{margin-left:auto;flex:none;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.status.typing .dot{background:var(--act)}
.cam{position:relative;flex:1;min-height:140px;background:#000;border-radius:10px;overflow:hidden;display:none}
.cam.on{display:block}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:3px solid var(--tag);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .camtools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.cam .camtools button{background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:6px 12px;font-weight:600;font-size:15px}
.cam .camhint{position:absolute;left:10px;right:10px;bottom:8px;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
.pending{display:none;align-items:center;gap:8px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ink);border:2px solid var(--ok);border-radius:12px;padding:8px}
.pending.on{display:flex}
.pending.on ~ .manual{display:none}
.cam.has-pending .camhint{display:none}
.cam.has-pending .frame{border-color:var(--ok)}
.pending .pc{flex:1;min-width:0}
.pending .pcode{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:22px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending .pq{font-size:15px;color:var(--muted)}
.pending .pq b{color:var(--act);font-size:20px}
.pending button{border-radius:10px;padding:12px 14px;font-weight:700;font-size:16px}
#camOk{background:var(--ok);color:#fff;border:0;padding:12px 18px}
#camSkip{background:var(--key);color:var(--ink);border:1px solid var(--line)}
.manual .cambtn{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:0 12px}
#scan{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0}

/* Sheets */
.veil{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.veil.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;user-select:text}
.sheet h2{margin:0;font-size:22px}
.sheet p{margin:0;color:var(--muted);line-height:1.4}
.sheet label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.sheet input{font:inherit;font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;font-size:16px;background:var(--key);border:1px solid var(--line)}
.btn.primary{background:var(--act);color:var(--actInk);border-color:var(--act)}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.zlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.zitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.zitem:last-child{border-bottom:0}
.zitem.cur{background:color-mix(in srgb,var(--tag) 20%,var(--surface))}
.zitem .zn{font-size:24px;font-weight:700;min-width:70px}
.zitem .zs{flex:1;color:var(--muted);font-size:14px}
.zitem .btn{padding:8px 10px;font-size:14px}
.zitem{flex-wrap:wrap}
.zbtns{display:flex;gap:6px;width:100%}
.zbtns .btn{flex:1}
.dlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:52vh;overflow-y:auto}
.dline{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.dline:last-child{border-bottom:0}
.dline .dn{color:var(--muted);font-size:13px;min-width:26px}
.dline .dc{flex:1;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dline .dm{font-size:12px;color:var(--muted)}
.dline .dq{font-size:22px;font-weight:700;min-width:40px;text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--key);padding:10px;font-weight:600;font-size:15px}
.seg button.on{background:var(--act);color:var(--actInk)}
.chk{flex-direction:row!important;align-items:center;gap:10px;font-weight:500!important}
.chk input{width:24px;height:24px;flex:none}
.expst{border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px}
.expst.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.expst.no{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.arch{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.arch .at{font-weight:700;font-size:17px}
.arch .as{color:var(--muted);font-size:14px}
.alarm{animation:alarmbg .5s steps(2) infinite}
@keyframes alarmbg{0%{border-top-color:var(--bad)}100%{border-top-color:var(--tag)}}
.cf{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cf.done{border-color:var(--ok)}
.cf .ct{font-weight:700;font-size:18px}
.cf .cs{color:var(--muted);font-size:14px}
.team{font-size:14px;border-radius:8px;padding:4px 10px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.team.ok{border-color:var(--ok)}
.team.wait{border-color:var(--tag)}
.team.err{border-color:var(--bad);color:var(--bad);font-weight:600}
.team b{color:var(--ink)}
.totals{display:flex;gap:16px;font-size:15px;color:var(--muted)}
.totals b{color:var(--ink);font-size:20px}
@media (prefers-reduced-motion:no-preference){ .flash{transition:background .15s} }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="tag empty" id="tagBtn" aria-label="Choisir une zone">
      <small>Zone</small><strong class="num" id="zoneName">À scanner</strong>
    </button>
    <div class="stats">
      <div class="big num" id="zoneQty">0 article</div>
      <div class="small" id="zoneLines">0 ligne dans la zone</div>
      <div class="small" id="who"></div>
    </div>
    <div class="topbtns">
      <button class="ghost" id="zonesBtn">Zones</button>
      <button class="ghost" id="menuBtn">Menu</button>
    </div>
  </div>

  <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Prêt à scanner</span><span class="pph" id="pph" title="Pièces par heure sur la mission"></span></div>
  <button class="team" id="team" hidden style="text-align:left"></button>
  <div class="flash" id="flash">Scanne l’étiquette de zone pour commencer.</div>

  <div class="list" id="list"></div>
  <div class="cam" id="cam">
    <video id="camVideo" playsinline muted autoplay></video>
    <div class="frame"></div>
    <div class="camtools"><button id="torchBtn" hidden>Lampe</button><button id="camClose">Arrêter</button></div>
    <div class="camhint">Vise le code-barres dans le cadre. Une fois lu, tape la quantité si besoin, puis « Valider ».</div>
  </div>

  <div class="pending" id="pend"><div class="pc"><div class="pcode" id="pCode"></div><div class="pq" id="pQty"></div></div><button id="camSkip">Ignorer</button><button id="camOk">Valider</button></div>
  <div class="manual">
    <input id="manualCode" inputmode="numeric" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code non scanné : tape-le ici" aria-label="Code article à saisir">
    <button id="manualAdd">Ajouter</button>
    <button id="camBtn" class="cambtn">Caméra</button>
  </div>

  <div class="qty" id="qtyBox">
    <span class="lbl" id="qtyLbl">Quantité du prochain scan</span>
    <span class="val num" id="qtyVal">1</span>
  </div>

  <div class="pad" id="pad">
    <button class="num" data-k="1">1</button><button class="num" data-k="2">2</button><button class="num" data-k="3">3</button>
    <button class="num" data-k="4">4</button><button class="num" data-k="5">5</button><button class="num" data-k="6">6</button>
    <button class="num" data-k="7">7</button><button class="num" data-k="8">8</button><button class="num" data-k="9">9</button>
    <button class="fn" data-k="C">Effacer</button><button class="num" data-k="0">0</button><button class="fn" data-k="B" aria-label="Retour arrière">⌫</button>
  </div>
  <div class="actions">
    <button id="undoBtn">Annuler le dernier</button>
    <button id="closeZoneBtn">Fermer la zone</button>
    <button id="manualBtn">Code avec lettres</button>
  </div>
</div>

<input id="scan" inputmode="none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Entrée scanner">

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
  const KEY = "comptage-zones-v1";
  const $ = id => document.getElementById(id);
  let state = load();
  let qtyBuf = "";
  let sheetOpen = false;
  let audioCtx = null;

  function blank(){ return {mission:"", counter:"", prefix:"Z", zone:null, zones:[], lines:[], seq:1, log:[], closed:[], merged:[], exportedSig:"", startedAt:new Date().toISOString()}; }
  const ARCH = "comptage-archives", MAX_ARCH = 5;
  function load(){
    try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.lines)) return Object.assign(blank(), s); }catch(e){}
    return blank();
  }
  function loadArch(){ try{ const a = JSON.parse(localStorage.getItem(ARCH)); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function saveArch(a){ localStorage.setItem(ARCH, JSON.stringify(a)); }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); if(state.team) scheduleSync(); return true; }
    catch(e){
      /* Memory full: drop the oldest archives that were already exported, then retry */
      try{
        let a = loadArch();
        while(a.length){ const i = a.findIndex(x => x.exported); if(i < 0) break; a.splice(i,1); saveArch(a); try{ localStorage.setItem(KEY, JSON.stringify(state)); flash("Mémoire pleine : une ancienne archive déjà exportée a été supprimée.", "bad"); return true; }catch(e2){} }
      }catch(e3){}
      beep(false); flash("MÉMOIRE PLEINE : exporte la mission maintenant et supprime des archives.", "bad");
      return false;
    }
  }
  const sigOf = s => s.seq + ":" + s.lines.length + ":" + s.lines.reduce((a,l)=>a+l.qty,0) + ":" + (s.log||[]).length;
  const isExported = () => !state.lines.length || state.exportedSig === sigOf(state);
  function logAct(action, zone, code, oldQ, newQ){
    state.log = state.log || [];
    state.log.push({t:new Date().toISOString(), action, zone:zone||"", code:code||"", oldQ:(oldQ===undefined?"":oldQ), newQ:(newQ===undefined?"":newQ), who:state.counter||""});
  }
  /* GTIN check digit (EAN-8, UPC-A, EAN-13, GTIN-14). Other codes are accepted as they are. */
  function eanValid(code){
    if(!/^\d+$/.test(code) || ![8,12,13,14].includes(code.length)) return true;
    const d = code.split("").map(Number), chk = d.pop();
    let s = 0; d.reverse().forEach((n,i) => { s += n * (i % 2 === 0 ? 3 : 1); });
    return (10 - s % 10) % 10 === chk;
  }

  const fmtQty = n => n + (n>1 ? " articles" : " article");
  const fmtLines = n => n + (n>1 ? " lignes" : " ligne");
  const linesOf = z => state.lines.filter(l => l.zone === z);
  const sum = arr => arr.reduce((a,l)=>a+l.qty,0);
  /* PPH: pieces per hour on active time; a gap over 5 min between two scans counts as a pause */
  const PAUSE_MS = 5*60*1000;
  function pphOf(lines){
    if(lines.length < 2) return null;
    const ts = lines.map(l => Date.parse(l.t)).sort((a,b)=>a-b);
    let active = 0;
    for(let i=1;i<ts.length;i++){ const g = ts[i]-ts[i-1]; if(g <= PAUSE_MS) active += g; }
    if(active < 60000) return null;
    return Math.round(sum(lines) / (active/3600000));
  }
  const fmtPph = v => v === null ? "—" : v.toLocaleString("fr-FR");
  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function zoneRegex(){ const p = (state.prefix||"Z").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); return new RegExp("^"+p+"\\d{1,6}$","i"); }

  /* Feedback */
  function getCtx(){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state === "suspended") audioCtx.resume();
    }catch(e){ audioCtx = null; }
    return audioCtx;
  }
  /* Unlock sound on the first touch or key press */
  ["pointerdown","keydown"].forEach(ev => window.addEventListener(ev, getCtx, {capture:true}));
  function tone(ctx, freq, start, dur, type, vol){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.setValueAtTime(vol, start + dur - 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(ctx.destination); o.start(start); o.stop(start + dur + 0.02);
  }
  function beep(ok, kind){
    const ctx = getCtx();
    if(ctx){
      try{
        const t = ctx.currentTime + 0.01;
        if(!ok){ tone(ctx, 330, t, 0.18, "square", 0.35); tone(ctx, 220, t + 0.22, 0.25, "square", 0.35); }
        else if(kind === "zone"){ tone(ctx, 1200, t, 0.09, "square", 0.3); tone(ctx, 1800, t + 0.12, 0.12, "square", 0.3); }
        else { tone(ctx, 2400, t, 0.12, "square", 0.3); }
      }catch(e){}
    }
    try{ navigator.vibrate && navigator.vibrate(ok ? 30 : [120,60,120]); }catch(e){}
  }
  /* Insistent alarm, repeated until the sheet is closed */
  let alarmTimer = null;
  function alarmStart(){
    alarmStop();
    const play = () => {
      const ctx = getCtx();
      if(ctx){ try{ const t = ctx.currentTime + 0.01;
        for(let i=0;i<4;i++){ tone(ctx, 950, t + i*0.2, 0.1, "sawtooth", 0.6); tone(ctx, 620, t + i*0.2 + 0.1, 0.1, "sawtooth", 0.6); }
      }catch(e){} }
      try{ navigator.vibrate && navigator.vibrate([300,100,300,100,300]); }catch(e){}
    };
    play(); alarmTimer = setInterval(play, 1200);
  }
  function alarmStop(){ if(alarmTimer){ clearInterval(alarmTimer); alarmTimer = null; try{ navigator.vibrate && navigator.vibrate(0); }catch(e){} } }
  function flash(msg, kind){ const f = $("flash"); f.className = "flash " + (kind||""); f.textContent = msg; }

  /* Render */
  function render(){
    const z = state.zone;
    $("tagBtn").classList.toggle("empty", !z);
    $("zoneName").textContent = z || "À scanner";
    const zl = z ? linesOf(z) : [];
    $("zoneQty").textContent = fmtQty(sum(zl));
    $("zoneLines").textContent = z ? fmtLines(zl.length) + " dans la zone" : "Aucune zone ouverte";
    const list = $("list");
    if(!z){
      list.innerHTML = '<div class="emptymsg">Scanne l’étiquette de zone (par exemple ' + esc((state.prefix||"Z")+"001") + ') ou touche « Zones » pour en ouvrir une.</div>';
    } else if(!zl.length){
      list.innerHTML = '<div class="emptymsg">Zone vide. Scanne un article : il compte pour 1. Pour un lot, tape d’abord la quantité, puis scanne.</div>';
    } else {
      const rows = zl.slice(-60).reverse();
      list.innerHTML = rows.map((l,i) =>
        '<button class="row'+(i===0?' latest':'')+'" data-id="'+l.id+'"><span class="code num">'+esc(l.code)+'</span>'+(l.src==="manuel"?'<span class="src">saisi</span>':'')+'<span class="q num">'+l.qty+'</span></button>'
      ).join("");
    }
    $("pph").textContent = "PPH " + fmtPph(pphOf(state.lines));
    try{ renderTeam(); }catch(e){}
    $("who").textContent = state.counter ? "Compteur : " + state.counter : "Compteur : à renseigner dans Menu";
    renderQty();
  }
  function showPending(){
    $("cam").classList.toggle("has-pending", !!cam.pending);
    $("pend").classList.toggle("on", !!cam.pending);
    if(cam.pending){ $("pCode").textContent = cam.pending; $("pQty").innerHTML = "Quantité : <b>" + (qtyBuf || "1") + "</b>"; }
  }
  function renderQty(){
    try{ showPending(); }catch(e){}
    const set = qtyBuf !== "";
    $("qtyBox").classList.toggle("set", set);
    $("qtyVal").textContent = set ? "× " + qtyBuf : "1";
    $("qtyLbl").textContent = set ? "Quantité du prochain scan" : "Scan simple : compte 1";
  }

  /* Scanner input */
  const scan = $("scan");
  function focusScan(){ if(!sheetOpen){ try{ scan.focus({preventScroll:true}); }catch(e){ scan.focus(); } } updateStatus(); }
  function updateStatus(){
    const typing = document.activeElement === $("manualCode");
    const on = document.activeElement === scan && document.hasFocus();
    $("status").classList.toggle("typing", typing);
    $("status").classList.toggle("off", !on && !typing);
    $("statusTxt").textContent = typing ? "Saisie manuelle : tape le code puis « Ajouter »" : on ? "Prêt à scanner" : "Scan en pause : touche l’écran pour reprendre";
  }
  scan.addEventListener("keydown", e => {
    if(e.key === "Enter" || e.key === "Tab"){
      e.preventDefault();
      const v = scan.value.trim(); scan.value = "";
      if(v) receiveScan(v, "scan");
    }
  });
  scan.addEventListener("blur", () => setTimeout(updateStatus, 50));
  scan.addEventListener("focus", updateStatus);
  window.addEventListener("focus", () => setTimeout(focusScan, 50));
  window.addEventListener("blur", updateStatus);
  document.addEventListener("click", e => { if(!sheetOpen && !e.target.closest(".row, .manual, #manualBtn")) focusScan(); });

  function codeError(code, src){
    if(cam.on){ cam.block = code; cam.misses = 0; }
    beep(false); flash("ERREUR : code-barres invalide, non compté.", "bad");
    openSheet('<h2>Code invalide</h2><p class="num" style="font-size:20px;color:var(--ink)">'+esc(code)+'</p>'+
      '<p>Le chiffre de contrôle ne correspond pas : ce code a été '+(src === "manuel" ? 'mal tapé' : 'mal lu')+'. Il n’a <b>pas</b> été compté. '+(src === "manuel" ? 'Vérifie le code sur l’étiquette et retape-le.' : 'Rescanne l’article.')+'</p>'+
      '<div class="btnrow"><button class="btn primary" id="errOk">Compris</button></div>');
    $("sheet").classList.add("errsheet");
    $("errOk").onclick = () => { closeSheet(); if(src === "manuel"){ $("manualCode").value = code; } };
  }
  function handleCode(raw, src, force){
    const code = raw.replace(/\s+/g,"");
    if(zoneRegex().test(code)){ openZone(code.toUpperCase()); return; }
    if(!state.zone){ zoneError(code); return; }
    if(state.check !== false && !eanValid(code)){ codeError(code, src); return; }
    const qty = qtyBuf === "" ? 1 : parseInt(qtyBuf,10);
    if(!qty){ beep(false); flash("Quantité 0 refusée : efface et retape.", "bad"); qtyBuf=""; renderQty(); return; }
    const big = parseInt(state.bigQty,10) || 50;
    if(!force && qty >= big){
      beep(false);
      openSheet('<h2>Quantité élevée</h2><p class="num" style="font-size:20px;color:var(--ink)">'+esc(code)+'</p>'+
        '<p>Tu as tapé <b class="num" style="font-size:26px;color:var(--ink)">'+qty+'</b>. C’est bien la bonne quantité ?</p>'+
        '<div class="btnrow"><button class="btn" id="bqNo">Corriger</button><button class="btn primary" id="bqOk">Confirmer '+qty+'</button></div>');
      $("bqOk").onclick = () => { closeSheet(); handleCode(code, src, true); };
      $("bqNo").onclick = () => {
        closeSheet(); qtyBuf = ""; renderQty();
        if(src === "manuel"){ $("manualCode").value = code; }
        else if(state.confirm !== false){ cam.pending = code; cam.psrc = src; showPending(); }
        flash("Retape la quantité" + (src === "manuel" ? ", puis « Ajouter »." : ", puis « Valider »."), "");
      };
      return;
    }
    state.lines.push({id: state.seq++, zone: state.zone, code, qty, t: new Date().toISOString(), src: src || "scan", who: state.counter || ""});
    qtyBuf = ""; if(!save()){ state.lines.pop(); state.seq--; render(); return; } render(); beep(true);
    flash("+" + qty + "   " + code + (src === "manuel" ? "   (saisi)" : ""), "ok");
  }
  function zoneError(code){
    if(cam.on){ cam.block = code; cam.misses = 0; }
    beep(false); flash("ERREUR : article scanné sans zone ouverte.", "bad");
    openSheet('<h2>Aucune zone ouverte</h2><p class="num" style="font-size:20px;color:var(--ink)">'+esc(code)+'</p>'+
      '<p>Cet article n’a <b>pas</b> été compté. Scanne d’abord l’étiquette de zone, puis rescanne l’article.</p>'+
      '<div class="btnrow"><button class="btn primary" id="errOk">Compris</button></div>');
    $("sheet").classList.add("errsheet");
    $("errOk").onclick = closeSheet;
  }
  function closeZone(){
    if(cam.pending){ beep(false); flash("Valide ou ignore d’abord le code " + cam.pending + ".", "bad"); return; }
    if(!state.zone){ flash("Aucune zone ouverte.", ""); return; }
    const z = state.zone, zl = linesOf(z);
    markClosed(z);
    state.zone = null; qtyBuf = ""; save(); render(); beep(true, "zone");
    flash("Zone " + z + " fermée : " + fmtLines(zl.length) + ", " + fmtQty(sum(zl)) + ". Scanne la zone suivante.", "zone");
    if(state.autoBackup !== false && state.lines.length){
      exportXlsx(state, {silent:true, suffix:"_sauvegarde"}).then(ok => { if(ok) flash("Zone " + z + " fermée (" + fmtQty(sum(zl)) + "). Sauvegarde Excel dans Téléchargements.", "zone"); });
    }
  }
  function markClosed(z){ state.closed = state.closed || []; if(z && !state.closed.includes(z)) state.closed.push(z); }
  function openZone(z, force){
    if(cam.pending){ beep(false); flash("Valide ou ignore d’abord le code " + cam.pending + ".", "bad"); return; }
    if(z === state.zone){ flash("Zone " + z + " déjà ouverte : continue le comptage.", "zone"); beep(true, "zone"); return; }
    const tz = state.team && teamZones[z];
    if(!force && tz && tz.device !== deviceId && !linesOf(z).length){
      if(cam.on){ cam.block = z; cam.misses = 0; }
      const who = tz.who || "un autre téléphone", open = tz.status === "open";
      flash("ALERTE : zone " + z + (open ? " en cours chez " : " déjà fermée par ") + who + ".", "bad");
      openSheet('<h2>Zone '+esc(z)+(open ? ' déjà en cours' : ' déjà comptée')+'</h2>'+
        '<p><b>'+esc(who)+'</b> '+(open ? 'est en train de compter cette zone' : 'a déjà compté et fermé cette zone')+' (depuis '+new Date(tz.at).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"})+'). La compter aussi ici risque de doubler le stock.</p>'+
        '<div class="btnrow"><button class="btn primary" id="roNo">Ne pas l’ouvrir</button></div>'+
        '<div class="btnrow"><button class="btn danger" id="roOk">L’ouvrir quand même</button></div>');
      $("sheet").classList.add("errsheet","alarm");
      alarmStart();
      $("roNo").onclick = () => { closeSheet(); flash("Zone " + z + " non ouverte.", ""); };
      $("roOk").onclick = () => { closeSheet(); logAct("Zone ouverte malgré le comptage de " + who, z, "", "", ""); openZone(z, true); };
      return;
    }
    if(!force && (state.closed || []).includes(z)){
      if(cam.on){ cam.block = z; cam.misses = 0; }
      const zl = linesOf(z);
      flash("ALERTE : la zone " + z + " est déjà fermée.", "bad");
      openSheet('<h2>Zone '+esc(z)+' déjà fermée</h2>'+
        '<p>Cette zone a été comptée et fermée ('+fmtLines(zl.length)+', '+fmtQty(sum(zl))+'). La rouvrir permet d’<b>ajouter</b> des articles à ce comptage : risque de compter deux fois.</p>'+
        '<p>Pour la refaire entièrement, utilise plutôt « Recompter » dans Zones.</p>'+
        '<div class="btnrow"><button class="btn primary" id="roNo">Ne pas rouvrir</button></div>'+
        '<div class="btnrow"><button class="btn danger" id="roOk">Rouvrir quand même</button></div>');
      $("sheet").classList.add("errsheet","alarm");
      alarmStart();
      $("roNo").onclick = () => { closeSheet(); flash("Zone " + z + " laissée fermée.", ""); };
      $("roOk").onclick = () => { closeSheet(); logAct("Réouverture d’une zone fermée", z, "", sum(zl), ""); openZone(z, true); };
      return;
    }
    if(state.zone && linesOf(state.zone).length) markClosed(state.zone);
    if(force) state.closed = (state.closed || []).filter(x => x !== z);
    if(!state.zones.includes(z)) state.zones.push(z);
    const already = linesOf(z).length;
    state.zone = z; qtyBuf = ""; save(); render(); beep(true, "zone");
    flash(already ? "Zone " + z + " rouverte : " + fmtLines(already) + " déjà comptées." : "Zone " + z + " ouverte.", "zone");
  }

  /* Keypad: keep focus on the scanner field */
  document.querySelectorAll(".pad button, .actions button, .topbtns button, #tagBtn").forEach(b =>
    b.addEventListener("pointerdown", e => e.preventDefault()));
  $("pad").addEventListener("click", e => {
    const k = e.target.closest("button")?.dataset.k; if(!k) return;
    if(k === "C") qtyBuf = "";
    else if(k === "B") qtyBuf = qtyBuf.slice(0,-1);

    renderQty(); focusScan();
  });
  $("closeZoneBtn").addEventListener("click", closeZone);
  $("team").addEventListener("click", () => teamSheet());
  $("undoBtn").addEventListener("click", () => {
    if(!state.zone){ return; }
    const zl = linesOf(state.zone); const last = zl[zl.length-1];
    if(!last){ flash("Rien à annuler dans cette zone.", ""); return; }
    state.lines = state.lines.filter(l => l.id !== last.id); logAct("Annulation du dernier scan", last.zone, last.code, last.qty, 0); save(); render();
    flash("Annulé : " + last.code + " (" + last.qty + ")", "");
  });
  $("list").addEventListener("click", e => { const r = e.target.closest(".row"); if(r) editLine(+r.dataset.id); });

  /* Sheets */
  function openSheet(html){ sheetOpen = true; $("sheet").innerHTML = html; $("veil").classList.add("open"); updateStatus(); }
  function closeSheet(){ alarmStop(); $("sheet").classList.remove("errsheet","alarm"); sheetOpen = false; $("veil").classList.remove("open"); $("sheet").innerHTML = ""; focusScan(); }
  $("veil").addEventListener("click", e => { if(e.target.id === "veil") closeSheet(); });
  function confirmSheet(title, text, label, fn){
    openSheet('<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="btnrow"><button class="btn" id="cNo">Garder</button><button class="btn danger" id="cYes">'+esc(label)+'</button></div>');
    $("cNo").onclick = closeSheet; $("cYes").onclick = () => { fn(); closeSheet(); };
  }

  /* Detail of a zone: every line in scan order, or totals per code */
  function zoneDetail(z, mode){
    const zl = linesOf(z);
    const modeLbl = l => l.src === "manuel" ? "saisi" : l.src === "camera" ? "caméra" : "scan";
    let rows;
    if(mode === "code"){
      const m = new Map();
      zl.forEach(l => { const e = m.get(l.code) || {qty:0, n:0}; e.qty += l.qty; e.n++; m.set(l.code, e); });
      rows = [...m.entries()].map(([c,e], i) =>
        '<div class="dline"><span class="dn num">'+(i+1)+'</span><span class="dc num">'+esc(c)+'</span><span class="dm">'+e.n+' scan'+(e.n>1?'s':'')+'</span><span class="dq num">'+e.qty+'</span></div>').join("");
    } else {
      rows = zl.map((l, i) =>
        '<button class="dline" data-line="'+l.id+'"><span class="dn num">'+(i+1)+'</span><span class="dc num">'+esc(l.code)+'</span><span class="dm">'+modeLbl(l)+'</span><span class="dq num">'+l.qty+'</span></button>').join("");
    }
    const nCodes = new Set(zl.map(l => l.code)).size;
    openSheet('<h2>Zone '+esc(z)+(z === state.zone ? ' (ouverte)' : '')+'</h2>'+
      '<div class="totals"><span><b class="num">'+sum(zl)+'</b> articles</span><span><b class="num">'+zl.length+'</b> scans</span><span><b class="num">'+nCodes+'</b> codes</span></div>'+
      '<div class="seg"><button id="dScan" class="'+(mode==="code"?'':'on')+'">Par scan</button><button id="dCode" class="'+(mode==="code"?'on':'')+'">Total par code</button></div>'+
      (zl.length ? '<div class="dlist">'+rows+'</div>' : '<p>Aucun article compté dans cette zone.</p>')+
      (mode==="code" ? '' : '<p style="font-size:14px">Touche une ligne pour corriger sa quantité ou la supprimer.</p>')+
      '<div class="btnrow"><button class="btn" id="dBack">Retour aux zones</button><button class="btn" id="dNo">Fermer</button></div>');
    $("dScan").onclick = () => zoneDetail(z, "scan");
    $("dCode").onclick = () => zoneDetail(z, "code");
    $("dBack").onclick = zonesSheet;
    $("dNo").onclick = closeSheet;
    $("sheet").querySelectorAll("[data-line]").forEach(b => b.onclick = () => editLine(+b.dataset.line, () => zoneDetail(z, "scan")));
  }
  function editLine(id, back){
    const done = () => back ? back() : closeSheet();
    const l = state.lines.find(x => x.id === id); if(!l) return;
    openSheet('<h2>Corriger la ligne</h2><p class="num" style="font-size:20px;color:var(--ink)">'+esc(l.code)+'</p>'+
      '<label>Quantité<input id="eq" type="number" inputmode="numeric" min="1" value="'+l.qty+'"></label>'+
      '<div class="btnrow"><button class="btn danger" id="eDel">Supprimer</button><button class="btn" id="eNo">Fermer</button><button class="btn primary" id="eOk">Enregistrer</button></div>');
    $("eNo").onclick = done;
    $("eDel").onclick = () => { state.lines = state.lines.filter(x => x.id !== id); logAct("Suppression de ligne", l.zone, l.code, l.qty, 0); save(); render(); flash("Ligne supprimée : " + l.code, ""); done(); };
    $("eOk").onclick = () => { const q = parseInt($("eq").value,10); if(q>0 && q !== l.qty){ logAct("Correction de quantité", l.zone, l.code, l.qty, q); l.qty = q; save(); render(); flash("Corrigé : " + l.code + " = " + q, "ok"); } done(); };
  }

  /* Manual code field */
  const mc = $("manualCode");
  function addManual(){
    const v = mc.value.trim();
    if(!v){ flash("Tape le code de l’article avant d’ajouter.", "bad"); mc.focus(); return; }
    if(cam.pending){ beep(false); flash("Valide ou ignore d’abord le code " + cam.pending + ".", "bad"); return; }
    mc.value = ""; mc.setAttribute("inputmode","numeric"); $("manualBtn").textContent = "Code avec lettres";
    mc.blur(); handleCode(v, "manuel"); focusScan();

  $("manualAdd").addEventListener("pointerdown", e => e.preventDefault());
  $("manualAdd").addEventListener("click", addManual);

  mc.addEventListener("blur", () => setTimeout(updateStatus, 50));
  $("manualBtn").addEventListener("click", () => {

    mc.setAttribute("inputmode", toText ? "text" : "numeric");

  function zonesSheet(){
    const items = state.zones.map(z => {
      const zl = linesOf(z);
      return '<div class="zitem'+(z===state.zone?' cur':'')+'"><span class="zn num">'+esc(z)+'</span><span class="zs">'+fmtLines(zl.length)+'<br>'+fmtQty(sum(zl))+'<br>PPH '+fmtPph(pphOf(zl))+'</span>'+
        '<div class="zbtns"><button class="btn" data-view="'+esc(z)+'">Voir les articles</button><button class="btn" data-open="'+esc(z)+'">Ouvrir</button><button class="btn danger" data-reset="'+esc(z)+'">Recompter</button></div></div>';
    }).join("");
    openSheet('<h2>Zones</h2><div class="totals"><span><b class="num">'+state.zones.length+'</b> zones</span><span><b class="num">'+sum(state.lines)+'</b> articles</span></div>'+
      (items ? '<div class="zlist">'+items+'</div>' : '<p>Aucune zone pour l’instant. Scanne une étiquette ou crée une zone ici.</p>')+
      '<label>Ouvrir ou créer une zone<input id="nz" class="num" autocomplete="off" placeholder="'+esc((state.prefix||"Z")+"001")+'"></label>'+
      '<div class="btnrow"><button class="btn" id="zNo">Fermer</button><button class="btn primary" id="zOk">Ouvrir cette zone</button></div>');
    $("zNo").onclick = closeSheet;
    $("zOk").onclick = () => {
      let v = $("nz").value.trim().toUpperCase(); if(!v) return;
      if(/^\d+$/.test(v)) v = (state.prefix||"Z").toUpperCase() + v.padStart(3,"0");
      closeSheet(); openZone(v);
    };
    $("sheet").querySelectorAll("[data-open]").forEach(b => b.onclick = () => { const z = b.dataset.open; closeSheet(); openZone(z); });
    $("sheet").querySelectorAll("[data-view]").forEach(b => b.onclick = () => zoneDetail(b.dataset.view, "scan"));
    $("sheet").querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
      const z = b.dataset.reset, n = linesOf(z).length;
      confirmSheet("Recompter " + z + " ?", "Les " + fmtLines(n) + " de cette zone seront effacées, puis la zone sera rouverte vide.", "Effacer et recompter", () => {
        const gone = linesOf(z); logAct("Recomptage : zone vidée (" + fmtLines(gone.length) + ")", z, "", sum(gone), 0);
        if(state.zone && state.zone !== z && linesOf(state.zone).length) markClosed(state.zone);
        state.closed = (state.closed || []).filter(x => x !== z);
        state.lines = state.lines.filter(l => l.zone !== z); state.zone = z; save(); render(); flash("Zone " + z + " vidée : recomptage.", "zone");
      });
    });
  }
  $("zonesBtn").addEventListener("click", zonesSheet);
  $("tagBtn").addEventListener("click", zonesSheet);

  /* Export */
  function stamp(){ const d = new Date(), p = n => String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+"h"+p(d.getMinutes()); }
  function baseName(s){ s = s || state; const m = (s.mission||"inventaire").replace(/[^\p{L}\p{N}_-]+/gu,"_").slice(0,40); return m + "_" + stamp(); }
  function consolidated(s){
    s = s || state; const map = new Map();
    s.lines.forEach(l => { const e = map.get(l.code) || {qty:0, zones:new Set()}; e.qty += l.qty; e.zones.add(l.zone); map.set(l.code, e); });
    return [...map.entries()].map(([code,e]) => [code, e.qty, [...e.zones].join(" ")]);
  }
  function detailRows(s){ return (s || state).lines.map(l => [l.zone, l.code, l.qty, l.src === "manuel" ? "Saisie manuelle" : l.src === "camera" ? "Caméra" : "Scan", l.who || "", new Date(l.t).toLocaleString("fr-FR")]); }
  async function saveFile(filename, data, silent){
    let dl = null; try{ if(window.claude && !silent) dl = await window.claude.use("downloads"); }catch(e){}
    if(!dl && silent && window.claude) return false;
    if(!dl){
      try{
        const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".csv") ? "text/csv" : "application/octet-stream"});
        const file = new File([blob], filename, {type: blob.type || "application/octet-stream"});
        if(!silent && navigator.canShare && navigator.canShare({files:[file]})){
          try{ await navigator.share({files:[file], title: filename}); flash("Fichier partagé : " + filename, "ok"); return true; }
          catch(e){ if(e && e.name === "AbortError"){ flash("Partage annulé : fichier enregistré dans Téléchargements.", ""); } }
        }
        const url = URL.createObjectURL(blob), a = document.createElement("a");
        a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        if(!silent) flash("Fichier enregistré dans Téléchargements : " + filename, "ok");
        return true;
      }catch(e){ flash("Export impossible sur cet appareil.", "bad"); return false; }
    }

  function parseFrDate(v){
    if(v instanceof Date) return v.toISOString();
    const m = String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if(!m) return new Date().toISOString();
    return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +(m[6]||0)).toISOString();
  }

    const ix = n => hd.indexOf(n);

    const fp = hashStr(lines.map(l => l.zone+"|"+l.code+"|"+l.qty+"|"+l.t).join(";"));

        if(z !== state.zone && !linesOf(z).length) return;
        const st = z === state.zone ? "open" : "closed";
        if(snapZ[z] !== st){ ops.push(b => b.set(m.collection("zones").doc(z), {status:st, device:deviceId, who:state.counter||"", at:new Date().toISOString()})); snapZ[z] = st; zoneOps++; }
      });
      const log = state.log || [];
      for(let i = sync.logN || 0; i < log.length; i++){ const x = log[i]; ops.push(b => b.set(m.collection("log").doc(deviceId + "_" + i), Object.assign({device:deviceId}, x))); }
      const now = Date.now();
      if(ops.length && (zoneOps || now - lastDevW > 20000)){
        lastDevW = now;
        ops.push(b => b.set(m.collection("devices").doc(deviceId), {who:state.counter||"", lines:state.lines.length, qty:sum(state.lines), at:new Date().toISOString()}));
      }
      if(!ops.length){ syncing = false; renderTeam(); return; }
      state.sync = {lines:snapL, zones:snapZ, logN:log.length}; saveRaw();
      for(let i = 0; i < ops.length; i += 400){
        const b = db.batch(); ops.slice(i, i + 400).forEach(f => f(b));
        inflight++; setPending(getPending() + 1);
        b.commit().then(() => { inflight--; setPending(getPending() - 1); lastErr = ""; renderTeam(); })
                  .catch(e => { inflight--; lastErr = errMsg(e); renderTeam(); });
      }
    }catch(e){ lastErr = errMsg(e); }
    syncing = false; renderTeam();
  }
  async function reconcile(){
    if(!state.team) return;
    await fbInit();
    const snap = await mref().collection("lines").where("device", "==", deviceId).get({source:"server"});
    const lines = {};
    snap.forEach(d => { const x = d.data(); lines[d.id.slice(deviceId.length + 1)] = x.qty + "|" + x.code + "|" + x.zone; });
    state.sync = {lines, zones:{}, logN:0}; saveRaw(); setPending(0); lastDevW = 0;
    await runSync();
  }
  function stopTeam(){ unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = []; teamZones = {}; teamDevices = {}; renderTeam(); }
  function startListeners(){
    stopTeam(); if(!state.team || !db) return;
    const m = mref();
    unsubs.push(m.collection("zones").onSnapshot(s => { teamZones = {}; s.forEach(d => { teamZones[d.id] = d.data(); }); }, e => { lastErr = errMsg(e); renderTeam(); }));
    unsubs.push(m.collection("devices").onSnapshot(s => { teamDevices = {}; s.forEach(d => { teamDevices[d.id] = d.data(); }); renderTeam(); }, () => {}));
  }
  function teamBoot(){
    renderTeam();
    if(!state.team) return;
    fbInit().then(() => {
      startListeners();
      if(getPending() > 0 && navigator.onLine) reconcile().catch(() => runSync()); else runSync();
    }).catch(e => { lastErr = errMsg(e); renderTeam(); });
  }
  window.addEventListener("online", () => { if(state.team){ lastErr = ""; teamBoot(); } });
  window.addEventListener("offline", renderTeam);
  function teamTotals(){
    let n = 0, q = 0, devs = 0;
    Object.entries(teamDevices).forEach(([id, d]) => { if(id === deviceId) return; devs++; n += d.lines || 0; q += d.qty || 0; });
    return {devs: devs + 1, n: n + state.lines.length, q: q + sum(state.lines)};
  }
  function renderTeam(){
    const el = $("team"); if(!el) return;
    if(!state.team){ el.hidden = true; return; }
    el.hidden = false;
    const t = teamTotals();
    let st, cls;
    if(!navigator.onLine){ st = "hors ligne : " + (inflight || getPending() ? "envoi au retour du réseau" : "comptage enregistré"); cls = "wait"; }
    else if(lastErr){ st = lastErr; cls = "err"; }
    else if(inflight){ st = "envoi en cours…"; cls = "wait"; }
    else { st = "synchronisé"; cls = "ok"; }
    el.className = "team " + cls;
    el.innerHTML = '<b class="num">Équipe ' + esc(state.team.code) + '</b> · ' + t.devs + ' app. · <span class="num">' + t.q + '</span> art. · ' + esc(st);
  }
  function genCode(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; const r = new Uint32Array(6); crypto.getRandomValues(r); r.forEach(x => { s += a[x % a.length]; }); return s; }
  async function createTeam(){
    flash("Création de la mission d’équipe…", "");
    try{
      await fbInit();
      let code, tries = 0;
      do{ code = genCode(); tries++; }while((await mref(code).get({source:"server"})).exists && tries < 5);
      await mref(code).set({name: state.mission || "Mission", createdAt: new Date().toISOString(), createdBy: fbUser.uid});
      state.team = {code, joinedAt: new Date().toISOString()}; state.sync = {lines:{}, zones:{}, logN:0}; lastErr = ""; lastDevW = 0;
      save(); startListeners(); runSync(); teamSheet();
      flash("Mission d’équipe créée : code " + code + ".", "ok");
    }catch(e){ beep(false); flash(errMsg(e), "bad"); }
  }
  async function joinTeam(raw){
    const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if(code.length !== 6){ beep(false); flash("Le code mission contient 6 caractères.", "bad"); return; }
    flash("Connexion à la mission " + code + "…", "");
    try{
      await fbInit();
      const d = await mref(code).get({source:"server"});
      if(!d.exists){ beep(false); flash("Code " + code + " inconnu : vérifie-le avec ton collègue.", "bad"); return; }
      const go = () => {
        if(state.lines.length && !archiveCurrent()){ flash("Archivage impossible (mémoire pleine).", "bad"); return; }
        state = Object.assign(blank(), settingsOf(state));
        state.mission = d.data().name || ""; state.team = {code, joinedAt: new Date().toISOString()}; state.sync = {lines:{}, zones:{}, logN:0};
        lastErr = ""; lastDevW = 0; qtyBuf = ""; save(); render(); startListeners(); runSync(); teamSheet();
        flash("Tu as rejoint la mission " + code + ". Scanne ta première zone.", "ok");
      };
      if(state.lines.length){
        confirmSheet("Rejoindre " + code + " ?", "Ta mission actuelle (" + fmtLines(state.lines.length) + ") sera rangée dans les archives, puis tu commenceras à compter pour la mission d’équipe.", "Archiver et rejoindre", go);
      } else go();
    }catch(e){ beep(false); flash(errMsg(e), "bad"); }
  }
  function leaveTeam(){
    confirmSheet("Quitter l’équipe ?", "Ce téléphone arrêtera d’envoyer ses scans. Le comptage reste sur le téléphone, et ce qui a déjà été envoyé reste en ligne.", "Quitter", () => {
      state.team = null; state.sync = null; save(); stopTeam(); flash("Équipe quittée : comptage local uniquement.", "");
    });
  }
  async function fetchTeam(){
    await fbInit();
    const m = mref();
    let src = "server", ls, lg;
    try{ [ls, lg] = await Promise.all([m.collection("lines").get({source:"server"}), m.collection("log").get({source:"server"})]); }
    catch(e){ src = "cache"; [ls, lg] = await Promise.all([m.collection("lines").get({source:"cache"}), m.collection("log").get({source:"cache"})]); }
    const lines = [], log = [];
    ls.forEach(d => { const x = d.data(); if(x.device !== deviceId) lines.push({zone:x.zone, code:x.code, qty:x.qty, src:x.src, who:x.who || ("appareil " + x.device), t:x.t, device:x.device}); });
    state.lines.forEach(l => lines.push(Object.assign({device:deviceId}, l, {who: l.who || state.counter || "moi"})));
    lg.forEach(d => { const x = d.data(); if(x.device !== deviceId) log.push(x); });
    (state.log || []).forEach(x => log.push(x));
    lines.sort((a, b) => String(a.t).localeCompare(String(b.t)));
    log.sort((a, b) => String(a.t).localeCompare(String(b.t)));
    return {lines, log, src};
  }
  async function exportTeam(){
    flash("Récupération des comptages de l’équipe…", "");
    try{
      const {lines, log, src} = await fetchTeam();
      const byZone = {}, byWho = {};
      lines.forEach(l => {
        (byZone[l.zone] = byZone[l.zone] || {}); byZone[l.zone][l.who] = (byZone[l.zone][l.who] || 0) + l.qty;
        const w = byWho[l.who] = byWho[l.who] || {n:0, q:0, z:new Set()}; w.n++; w.q += l.qty; w.z.add(l.zone);
      });
      const dbl = Object.entries(byZone).filter(([, w]) => Object.keys(w).length > 1);
      const extra = [
        {name: "Par compteur", aoa: [["Compteur", "Lignes", "Articles", "Zones"], ...Object.entries(byWho).map(([w, x]) => [w, x.n, x.q, [...x.z].sort().join(" ")])]},
        {name: "Contrôles", aoa: [["Zone comptée par plusieurs compteurs", "Détail (articles par compteur)"],
          ...(dbl.length ? dbl.map(([z, w]) => [z, Object.entries(w).map(([k, v]) => k + " : " + v).join(" | ")]) : [["Aucune zone en double", ""]])]}
      ];
      const s = {mission: (state.mission || "mission") + "_equipe_" + state.team.code, lines, log, extraSheets: extra};
      const ok = await exportXlsx(s);
      if(ok && src === "cache") flash("Export fait SANS réseau : les derniers scans des autres téléphones peuvent manquer.", "bad");
      if(ok && dbl.length) flash("Export équipe fait. Attention : " + dbl.length + " zone(s) comptée(s) par plusieurs personnes (onglet Contrôles).", "bad");
    }catch(e){ beep(false); flash(errMsg(e), "bad"); }
  }
  async function deleteOnline(){
    flash("Suppression des données en ligne…", "");
    try{
      await fbInit();
      const m = mref();
      for(const c of ["lines", "log", "zones", "devices"]){
        const s = await m.collection(c).get({source:"server"});
        const docs = s.docs;
        for(let i = 0; i < docs.length; i += 400){ const b = db.batch(); docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
      }
      await m.delete();
      const code = state.team.code;
      state.team = null; state.sync = null; save(); stopTeam(); closeSheet();
      flash("Données en ligne de la mission " + code + " supprimées. Le comptage reste sur ce téléphone.", "ok");
    }catch(e){ beep(false); flash(errMsg(e), "bad"); }
  }
  function teamSheet(){
    if(!state.team){
      openSheet('<h2>Équipe en ligne</h2>'+
        '<p>Relie plusieurs téléphones à la même mission. Chacun ne voit que ses propres scans ; tout est envoyé en ligne (même plus tard si le réseau coupe) et tu peux exporter le travail de toute l’équipe dans un seul Excel.</p>'+
        '<div class="btnrow"><button class="btn primary" id="tCreate">Créer une mission d’équipe</button></div>'+
        '<label>Ou rejoindre avec le code de ton collègue<input id="tCode" class="num" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="Ex. K7P4QX" style="text-transform:uppercase;letter-spacing:3px"></label>'+
        '<div class="btnrow"><button class="btn" id="tBack">Retour</button><button class="btn primary" id="tJoin">Rejoindre</button></div>');
      $("tCreate").onclick = createTeam;
      $("tJoin").onclick = () => joinTeam($("tCode").value);
      $("tBack").onclick = () => $("menuBtn").click();
      return;
    }
    const devs = Object.entries(teamDevices).map(([id, d]) =>
      '<div class="zitem"><span class="zs" style="color:var(--ink)"><b>'+esc(id === deviceId ? (state.counter || "Ce téléphone") + " (ce téléphone)" : (d.who || "Appareil " + id))+'</b><br>'+
      (id === deviceId ? fmtLines(state.lines.length) + " · " + fmtQty(sum(state.lines)) : fmtLines(d.lines || 0) + " · " + fmtQty(d.qty || 0) + " · vu " + (d.at ? new Date(d.at).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}) : "?"))+'</span></div>').join("");
    const t = teamTotals();
    openSheet('<h2>Équipe en ligne</h2>'+
      '<p>Code mission à donner à ton collègue :</p><div class="num" style="font-size:44px;font-weight:700;letter-spacing:6px;text-align:center;background:var(--tag);color:var(--tagInk);border-radius:12px;padding:6px">'+esc(state.team.code)+'</div>'+
      '<div class="totals"><span><b class="num">'+t.devs+'</b> appareils</span><span><b class="num">'+t.q+'</b> articles</span></div>'+
      '<div class="team '+(lastErr ? 'err' : 'ok')+'" style="display:block">'+esc(lastErr || (navigator.onLine ? (inflight ? "Envoi en cours…" : "Tout est synchronisé.") : "Hors ligne : les scans partiront au retour du réseau."))+'</div>'+
      (devs ? '<div class="zlist">'+devs+'</div>' : '')+
      '<div class="btnrow"><button class="btn primary" id="tExp">Exporter toute l’équipe (Excel)</button></div>'+
      '<div class="btnrow"><button class="btn" id="tSync">Resynchroniser</button><button class="btn" id="tLeave">Quitter l’équipe</button></div>'+
      '<p style="font-size:14px">Après remise du rapport au client, supprime les données en ligne : elles restent sur les téléphones et dans tes exports.</p>'+
      '<div class="btnrow"><button class="btn danger" id="tDel">Supprimer les données en ligne</button></div>'+
      '<div class="btnrow"><button class="btn" id="tBack">Retour</button></div>');
    $("tExp").onclick = exportTeam;
    $("tSync").onclick = () => { lastErr = ""; flash("Resynchronisation…", ""); reconcile().then(() => { flash("Resynchronisation faite.", "ok"); teamSheet(); }).catch(e => flash(errMsg(e), "bad")); };
    $("tLeave").onclick = leaveTeam;
    $("tDel").onclick = () => confirmSheet("Supprimer les données en ligne ?", "Tous les scans de l’équipe pour la mission " + state.team.code + " seront effacés du serveur, pour tous les téléphones. Exporte toute l’équipe AVANT.", "Supprimer en ligne", deleteOnline);
    $("tBack").onclick = () => $("menuBtn").click();
  }

  /* Keep the screen on while counting, and ask Android not to clear storage */
  let wakeLock = null;
  async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") keepAwake(); });
  keepAwake();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

  /* Camera scanning */
  /* A code must be read on 2 frames in a row, then waits for "Valider".
     After that, the same code is ignored until it has left the frame for about 1 second. */
  const cam = {on:false, stream:null, timer:null, detector:null, zx:null, torch:false, pending:"", block:"", cand:"", candN:0, misses:0};
  function onCamCode(code){
    code = String(code || "").trim(); if(!code || !cam.on) return;
    cam.misses = 0;
    if(cam.pending || code === cam.block) return;
    if(code !== cam.cand){ cam.cand = code; cam.candN = 1; return; }
    if(++cam.candN < 2) return;
    cam.cand = ""; cam.candN = 0;
    if(zoneRegex().test(code)) cam.block = code;
    receiveScan(code, "camera");
  }
  /* Every article scan (scanner or camera) waits for "Valider" when the option is on */
  let lastScan = {code:"", t:0};
  function receiveScan(raw, src){
    const code = String(raw).replace(/\s+/g, "");
    if(!code || sheetOpen) return;
    const now = Date.now();
    if(src === "scan" && code === lastScan.code && now - lastScan.t < 500){ lastScan.t = now; return; }
    lastScan = {code, t: now};
    if(cam.pending){ beep(false); flash("Valide ou ignore d’abord le code " + cam.pending + ".", "bad"); return; }
    if(zoneRegex().test(code) || !state.zone || state.confirm === false){ handleCode(code, src); return; }
    if(state.check !== false && !eanValid(code)){ codeError(code, src); return; }
    cam.pending = code; cam.psrc = src; beep(true); showPending();
    flash("Code lu : tape la quantité si besoin, puis « Valider ».", "");
  }
  function onCamMiss(){
    if(++cam.misses >= 8){ cam.block = ""; cam.cand = ""; cam.candN = 0; }
  }
  function camValidate(){
    if(!cam.pending) return;
    const c = cam.pending, s = cam.psrc || "scan"; cam.pending = "";
    if(s === "camera"){ cam.block = c; cam.misses = 0; }
    handleCode(c, s); showPending(); focusScan();
  }
  function camSkip(){
    if(!cam.pending) return;
    if(cam.psrc === "camera"){ cam.block = cam.pending; cam.misses = 0; }
    cam.pending = ""; qtyBuf = ""; renderQty(); focusScan();
    flash("Code ignoré.", "");
  }
  function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  async function startCam(){
    if(cam.on) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ flash("Caméra indisponible sur cet appareil.", "bad"); return; }
    try{
      cam.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    }catch(e){
      flash(e && e.name === "NotAllowedError" ? "Accès à la caméra refusé : autorise-le dans les réglages de l’appli." : "Impossible d’ouvrir la caméra.", "bad");
      return;
    }
    const v = $("camVideo"); v.srcObject = cam.stream;
    try{ await v.play(); }catch(e){}
    cam.on = true; cam.torch = false; cam.block = ""; cam.cand = ""; cam.candN = 0;
    $("cam").classList.add("on"); $("list").style.display = "none"; $("camBtn").textContent = "Arrêter";
    $("torchBtn").textContent = "Lampe";
    try{ const t = cam.stream.getVideoTracks()[0]; const caps = t.getCapabilities ? t.getCapabilities() : {}; $("torchBtn").hidden = !caps.torch; }catch(e){ $("torchBtn").hidden = true; }
    cam.detector = null;
    if("BarcodeDetector" in window){
      try{
        const want = ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code","data_matrix"];
        const sup = await BarcodeDetector.getSupportedFormats();
        const formats = want.filter(f => sup.includes(f));
        if(formats.length) cam.detector = new BarcodeDetector({formats});
      }catch(e){ cam.detector = null; }
    }
    if(cam.detector){
      const loop = async () => {
        if(!cam.on) return;
        try{ if(v.readyState >= 2){ const r = await cam.detector.detect(v); if(r && r.length) onCamCode(r[0].rawValue); else onCamMiss(); } }catch(e){}
        if(cam.on) cam.timer = setTimeout(loop, 120);
      };
      loop();
    } else {
      try{ if(!window.ZXing) await loadScript("zxing.min.js"); }catch(e){ flash("Lecteur de codes non chargé : réessaie avec internet.", "bad"); stopCam(); return; }
      try{
        const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        cam.zx = new ZXing.BrowserMultiFormatReader(hints, 150);
        cam.zx.decodeFromStream(cam.stream, v, (result) => { if(!cam.on) return; if(result) onCamCode(result.getText()); else onCamMiss(); }).catch(() => {});
      }catch(e){ flash("Lecture caméra impossible sur cet appareil.", "bad"); stopCam(); return; }
    }
    flash("Caméra active : vise un code-barres.", "");
    focusScan();
  }
  function stopCam(){
    cam.on = false; clearTimeout(cam.timer);
    cam.block = ""; cam.cand = ""; cam.candN = 0; showPending();
    try{ if(cam.zx) cam.zx.reset(); }catch(e){}
    cam.zx = null;
    if(cam.stream){ cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
    $("camVideo").srcObject = null;
    $("cam").classList.remove("on"); $("list").style.display = ""; $("camBtn").textContent = "Caméra";
    focusScan();
  }
  $("camOk").addEventListener("click", camValidate);
  $("camSkip").addEventListener("click", camSkip);
  ["camBtn","camClose","torchBtn","camOk","camSkip"].forEach(id => $(id).addEventListener("pointerdown", e => e.preventDefault()));
  $("camBtn").addEventListener("click", () => { cam.on ? stopCam() : startCam(); });
  $("camClose").addEventListener("click", stopCam);
  $("torchBtn").addEventListener("click", async () => {
    const t = cam.stream && cam.stream.getVideoTracks()[0]; if(!t) return;
    cam.torch = !cam.torch;
    try{ await t.applyConstraints({advanced:[{torch: cam.torch}]}); $("torchBtn").textContent = cam.torch ? "Lampe off" : "Lampe"; }
    catch(e){ cam.torch = false; }
  });
  document.addEventListener("visibilitychange", () => { if(document.hidden && cam.on) stopCam(); });

  render(); focusScan(); teamBoot();
  if(state.zone){ const n = linesOf(state.zone).length; flash("Zone " + state.zone + " en cours : " + fmtLines(n) + " déjà comptée" + (n>1?"s":"") + ".", "zone"); }
  setInterval(updateStatus, 1500);
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
</body>
