<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comptage par zones</title>
<script src="xlsx.full.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFD23F">
<link rel="icon" href="logo-192.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#E8ECF0; --surface:#FFFFFF; --ink:#18222E; --muted:#5B6878; --line:#CBD3DC;
  --tag:#FFD23F; --tagInk:#1E1C10; --act:#1F5FBF; --actInk:#FFFFFF; --ok:#2B7A4B; --bad:#B8322A; --key:#F4F6F8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B222B; --surface:#25303B; --ink:#E7ECF1; --muted:#9AA7B5; --line:#3A4754;
    --act:#4C8DF0; --actInk:#FFFFFF; --ok:#52B57D; --bad:#E2655C; --key:#2D3946; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B222B; --surface:#25303B; --ink:#E7ECF1; --muted:#9AA7B5; --line:#3A4754;
  --act:#4C8DF0; --actInk:#FFFFFF; --ok:#52B57D; --bad:#E2655C; --key:#2D3946; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:8px;gap:7px;overflow:hidden}

/* Zone tag: the hang tag stuck on each fixture */
.top{display:flex;gap:10px;align-items:stretch}
.tag{position:relative;background:var(--tag);color:var(--tagInk);border-radius:6px 18px 18px 6px;
  padding:6px 16px 6px 30px;min-width:140px;display:flex;flex-direction:column;justify-content:center;border:0;text-align:left}
.tag::before{content:"";position:absolute;left:10px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;
  background:var(--bg);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.tag small{font-size:13px;font-weight:600;opacity:.75}
.tag strong{font-size:40px;line-height:1;font-weight:700;letter-spacing:.5px}
.tag.empty strong{font-size:22px;line-height:1.15}
.stats{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.stats .big{font-size:26px;font-weight:700;line-height:1}
.stats .small{color:var(--muted);font-size:14px}
.topbtns{display:flex;flex-direction:column;gap:6px}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600;font-size:15px}

.status{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);padding:0 2px;min-height:22px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.status.off .dot{background:var(--bad)}
.status.off{color:var(--bad);font-weight:600}

.flash{min-height:30px;border-radius:8px;padding:4px 10px;font-weight:600;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line)}
.flash.ok{border-color:var(--ok);color:var(--ok)}
.flash.bad{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.flash.zone{border-color:var(--tag);background:color-mix(in srgb,var(--tag) 22%,var(--surface))}

.list{flex:1 1 0;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row:last-child{border-bottom:0}
.row .code{flex:1;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .nm{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.row .nm.unk,.pq .unk{color:var(--bad);font-weight:600}
.row .q{font-size:24px;font-weight:700;min-width:48px;text-align:right}
.row.latest{box-shadow:inset 5px 0 0 var(--tag);background:color-mix(in srgb,var(--tag) 10%,var(--surface))}
.emptymsg{padding:18px 14px;color:var(--muted);line-height:1.4}

.qty{display:flex;align-items:baseline;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 14px}
.qty .lbl{font-size:15px;color:var(--muted)}
.qty .val{font-size:40px;font-weight:700;line-height:1.1;color:var(--muted)}
.qty.set{border-color:var(--act)}
.qty.set .val{color:var(--act)}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{background:var(--key);border:1px solid var(--line);border-radius:10px;height:clamp(38px,6vh,58px);font-size:26px;font-weight:600}
.pad button:active{background:var(--line)}
.pad .fn{font-size:16px;font-family:"Barlow",system-ui,sans-serif}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
#closeZoneBtn{border-color:var(--tag)!important;background:color-mix(in srgb,var(--tag) 25%,var(--surface))!important}
.errsheet{border-top:6px solid var(--bad)}
.errsheet h2{color:var(--bad);font-size:26px}
.errsheet .btn{font-size:20px;padding:16px}
.actions button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px;line-height:1.15}

.manual{display:flex;gap:6px}
.manual input{flex:1;min-width:0;font:inherit;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:22px;padding:8px 12px;border-radius:10px;border:1px dashed var(--muted);background:var(--surface);color:var(--ink);user-select:text;-webkit-user-select:text}
.manual input:focus{outline:none;border:2px solid var(--act)}
.manual input::placeholder{color:var(--muted);font-family:"Barlow",system-ui,sans-serif;font-size:16px}
.manual button{background:var(--act);color:var(--actInk);border:0;border-radius:10px;padding:0 16px;font-weight:600;font-size:16px}
.row .src{font-size:12px;font-weight:600;color:var(--act);border:1px solid var(--act);border-radius:5px;padding:1px 5px}
.status.typing{color:var(--act);font-weight:600}
.pph{margin-left:auto;flex:none;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 8px}
.status.typing .dot{background:var(--act)}
.cam{position:relative;flex:1;min-height:140px;background:#000;border-radius:10px;overflow:hidden;display:none}
.cam.on{display:block}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:3px solid var(--tag);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .camtools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.cam .camtools button{background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:6px 12px;font-weight:600;font-size:15px}
.cam .camhint{position:absolute;left:10px;right:10px;bottom:8px;color:#fff;font-size:14px;text-shadow:0 1px 3px #000}
.pending{display:none;align-items:center;gap:8px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ink);border:2px solid var(--ok);border-radius:12px;padding:8px}
.pending.on{display:flex}
.pending.on ~ .manual{display:none}
.cam.has-pending .camhint{display:none}
.cam.has-pending .frame{border-color:var(--ok)}
.pending .pc{flex:1;min-width:0}
.pending .pcode{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:22px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pending .pq{font-size:15px;color:var(--muted)}
.pending .pq b{color:var(--act);font-size:20px}
.pending button{border-radius:10px;padding:12px 14px;font-weight:700;font-size:16px}
#camOk{background:var(--ok);color:#fff;border:0;padding:12px 18px}
#camSkip{background:var(--key);color:var(--ink);border:1px solid var(--line)}
.manual .cambtn{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:0 12px}
#scan{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0}

/* Sheets */
.veil{position:fixed;inset:0;background:rgba(10,15,20,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.veil.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;user-select:text}
.sheet > *{flex-shrink:0}
.sheet h2{margin:0;font-size:22px}
.sheet p{margin:0;color:var(--muted);line-height:1.4}
.sheet label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.sheet input{font:inherit;font-size:20px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;font-size:16px;background:var(--key);border:1px solid var(--line)}
.btn.primary{background:var(--act);color:var(--actInk);border-color:var(--act)}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.zlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.zitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.zitem:last-child{border-bottom:0}
.zitem.cur{background:color-mix(in srgb,var(--tag) 20%,var(--surface))}
.zitem .zn{font-size:24px;font-weight:700;min-width:70px}
.zitem .zs{flex:1;color:var(--muted);font-size:14px}
.zitem .btn{padding:8px 10px;font-size:14px}
.zitem{flex-wrap:wrap}
.zbtns{display:flex;gap:6px;width:100%}
.zbtns .btn{flex:1}
.dlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:52vh;overflow-y:auto}
.dline{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.dline:last-child{border-bottom:0}
.dline .dn{color:var(--muted);font-size:13px;min-width:26px}
.dline .dc{flex:1;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dline .dm{font-size:12px;color:var(--muted)}
.dline .dq{font-size:22px;font-weight:700;min-width:40px;text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--key);padding:10px;font-weight:600;font-size:15px}
.seg button.on{background:var(--act);color:var(--actInk)}
.chk{flex-direction:row!important;align-items:center;gap:10px;font-weight:500!important}
.chk input{width:24px;height:24px;flex:none}
.expst{border-radius:10px;padding:8px 12px;font-weight:600;font-size:15px}
.expst.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.expst.no{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
.arch{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.arch .at{font-weight:700;font-size:17px}
.arch .as{color:var(--muted);font-size:14px}
.alarm{animation:alarmbg .5s steps(2) infinite}
@keyframes alarmbg{0%{border-top-color:var(--bad)}100%{border-top-color:var(--tag)}}
.cf{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.cf.done{border-color:var(--ok)}
.cf .ct{font-weight:700;font-size:18px}
.cf .cs{color:var(--muted);font-size:14px}
.team{font-size:14px;border-radius:8px;padding:4px 10px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.team.ok{border-color:var(--ok)}
.team.wait{border-color:var(--tag)}
.team.err{border-color:var(--bad);color:var(--bad);font-weight:600}
.team b{color:var(--ink)}
.totals{display:flex;gap:16px;font-size:15px;color:var(--muted)}
.totals b{color:var(--ink);font-size:20px}
@media (prefers-reduced-motion:no-preference){ .flash{transition:background .15s} }
/* Short screens (e.g. TC57 in a browser tab): compact everything so the whole
   keypad and the action buttons always fit without scrolling. */
@media (max-height:720px){
  .app{gap:5px;padding:6px}
  .tag{min-width:118px;padding:4px 12px 4px 26px}
  .tag strong{font-size:30px}
  .tag.empty strong{font-size:18px}
  .tag::before{left:8px;width:9px;height:9px;margin-top:-4.5px}
  .stats .big{font-size:21px}
  .stats .small{font-size:12px}
  .ghost{padding:4px 10px;font-size:14px}
  .status{min-height:18px;font-size:13px}
  .flash{min-height:26px;font-size:14px;padding:3px 9px}
  .emptymsg{padding:10px 12px;font-size:14px}
  .qty{padding:2px 12px}
  .qty .val{font-size:30px}
  .qty .lbl{font-size:13px}
  .pad{gap:5px}
  .pad button{height:clamp(34px,5.3vh,50px);font-size:23px}
  .pad .fn{font-size:14px}
  .manual input{font-size:19px;padding:6px 10px}
  .manual button{font-size:15px}
  .actions button{padding:8px 3px;font-size:13px}
}
@media (max-height:600px){
  .pad button{height:clamp(30px,4.6vh,44px);font-size:21px}
  .tag strong{font-size:26px}
  .list{min-height:40px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="tag empty" id="tagBtn" aria-label="Choisir une zone">
      <small>Zone</small><strong class="num" id="zoneName">À scanner</strong>
    </button>
    <div class="stats">
      <div class="big num" id="zoneQty">0 article</div>
      <div class="small" id="zoneLines">0 ligne dans la zone</div>
      <div class="small" id="who"></div>
    </div>
    <div class="topbtns">
      <button class="ghost" id="zonesBtn">Zones</button>
      <button class="ghost" id="menuBtn">Menu</button>
    </div>
  </div>

  <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Prêt à scanner</span><button class="pph" id="pph" title="Pièces par heure, pauses et temps morts compris"></button></div>
  <button class="team" id="team" hidden style="text-align:left"></button>
  <div class="flash" id="flash">Scanne l’étiquette de zone pour commencer.</div>

  <div class="list" id="list"></div>
  <div class="cam" id="cam">
    <video id="camVideo" playsinline muted autoplay></video>
    <div class="frame"></div>
    <div class="camtools"><button id="torchBtn" hidden>Lampe</button><button id="camClose">Arrêter</button></div>
    <div class="camhint">Vise le code-barres dans le cadre. Une fois lu, tape la quantité si besoin, puis « Valider ».</div>
  </div>

  <div class="pending" id="pend"><div class="pc"><div class="pcode" id="pCode"></div><div class="pq" id="pQty"></div></div><button id="camSkip">Ignorer</button><button id="camOk">Valider</button></div>
  <div class="manual">
    <input id="manualCode" inputmode="numeric" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Code non scanné : tape-le ici" aria-label="Code article à saisir">
    <button id="manualAdd">Ajouter</button>
    <button id="camBtn" class="cambtn">Caméra</button>
  </div>

  <div class="qty" id="qtyBox">
    <span class="lbl" id="qtyLbl">Quantité du prochain scan</span>
    <span class="val num" id="qtyVal">1</span>
  </div>

  <div class="pad" id="pad">
    <button class="num" data-k="1">1</button><button class="num" data-k="2">2</button><button class="num" data-k="3">3</button>
    <button class="num" data-k="4">4</button><button class="num" data-k="5">5</button><button class="num" data-k="6">6</button>
    <button class="num" data-k="7">7</button><button class="num" data-k="8">8</button><button class="num" data-k="9">9</button>
    <button class="fn" data-k="C">Effacer</button><button class="num" data-k="0">0</button><button class="fn" data-k="B" aria-label="Retour arrière">⌫</button>
  </div>
  <div class="actions">
    <button id="undoBtn">Annuler le dernier</button>
    <button id="closeZoneBtn">Fermer la zone</button>
    <button id="manualBtn">Code avec lettres</button>
  </div>
</div>

<input id="scan" inputmode="none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Entrée scanner">

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
  const KEY = "comptage-zones-v1";
  const $ = id => document.getElementById(id);
  let state = load();
  let qtyBuf = "";
  let sheetOpen = false;
  let audioCtx = null;

  function blank(){ return {mission:"", counter:"", prefix:"Z", zone:null, zones:[], lines:[], seq:1, log:[], closed:[], merged:[], exportedSig:"", startedAt:new Date().toISOString()}; }
  const ARCH = "comptage-archives", MAX_ARCH = 5;
  function load(){
    try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.lines)) return Object.assign(blank(), s); }catch(e){}
    return blank();
  }
  function loadArch(){ try{ const a = JSON.parse(localStorage.getItem(ARCH)); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function saveArch(a){ localStorage.setItem(ARCH, JSON.stringify(a)); }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); if(state.team) scheduleSync(); return true; }
    catch(e){
      /* Memory full: drop the oldest archives that were already exported, then retry */
      try{
        let a = loadArch();
        while(a.length){ const i = a.findIndex(x => x.exported); if(i < 0) break; a.splice(i,1); saveArch(a); try{ localStorage.setItem(KEY, JSON.stringify(state)); flash("Mémoire pleine : une ancienne archive déjà exportée a été supprimée.", "bad"); return true; }catch(e2){} }
      }catch(e3){}
      beep(false); flash("MÉMOIRE PLEINE : exporte la mission maintenant et supprime des archives.", "bad");
      return false;
    }
  }
  const sigOf = s => s.seq + ":" + s.lines.length + ":" + s.lines.reduce((a,l)=>a+l.qty,0) + ":" + (s.log||[]).length;
  const isExported = () => !state.lines.length || state.exportedSig === sigOf(state);
  function logAct(action, zone, code, oldQ, newQ){
    state.log = state.log || [];
    state.log.push({t:new Date().toISOString(), action, zone:zone||"", code:code||"", oldQ:(oldQ===undefined?"":oldQ), newQ:(newQ===undefined?"":newQ), who:state.counter||""});
  }
  /* GTIN check digit (EAN-8, UPC-A, EAN-13, GTIN-14). Other codes are accepted as they are. */
  function eanValid(code){
    if(!/^\d+$/.test(code) || ![8,12,13,14].includes(code.length)) return true;
    const d = code.split("").map(Number), chk = d.pop();
    let s = 0; d.reverse().forEach((n,i) => { s += n * (i % 2 === 0 ? 3 : 1); });
    return (10 - s % 10) % 10 === chk;
  }

  const fmtQty = n => n + (n>1 ? " articles" : " article");
  const fmtLines = n => n + (n>1 ? " lignes" : " ligne");
  const linesOf = z => state.lines.filter(l => l.zone === z);
  const sum = arr => arr.reduce((a,l)=>a+l.qty,0);
  /* PPH: pieces per hour on active time; a gap over 5 min between two scans counts as a pause */
  const PAUSE_MS = 5*60*1000;
  function pphOf(lines){
    if(lines.length < 2) return null;
    const ts = lines.map(l => Date.parse(l.t)).sort((a,b)=>a-b);
    let active = 0;
    for(let i=1;i<ts.length;i++){ const g = ts[i]-ts[i-1]; if(g <= PAUSE_MS) active += g; }
    if(active < 60000) return null;

  const fmtPph = v => v === null ? "—" : v.toLocaleString("fr-FR");
  /* Real PPH: pieces / elapsed time, latency and short pauses included.
     The clock stops after 10 min without any activity (scan, zone opened or closed):
     each idle gap counts for at most 10 min. */
  const IDLE_CAP = 10*60*1000;
  function segOpen(z){ if(!z) return; state.zoneTimes = state.zoneTimes || {}; const a = state.zoneTimes[z] = state.zoneTimes[z] || []; const l = a[a.length-1]; if(!l || l.c) a.push({o: Date.now()}); }
  function segClose(z){ if(!z || !state.zoneTimes || !state.zoneTimes[z]) return; const a = state.zoneTimes[z], l = a[a.length-1]; if(l && !l.c) l.c = Date.now(); }
  function cappedSpan(ts){ ts = ts.filter(x => !isNaN(x)).sort((a,b) => a-b); let s = 0; for(let i=1;i<ts.length;i++) s += Math.min(ts[i]-ts[i-1], IDLE_CAP); return s; }
  function zoneSpan(s, z){
    const segs = (s.zoneTimes || {})[z], lt = s.lines.filter(l => l.zone === z).map(l => Date.parse(l.t));

  function getCtx(){

    g.gain.setValueAtTime(vol, start + dur - 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);

  /* Hardware scanner capture. Two injection modes exist on Zebra terminals:
     (A) one key event per character + Enter  -> caught by the global keydown wedge;
     (B) the whole string committed at once into the focused field (IME) -> caught by
         the hidden #scan input's "input" event. We handle both. */
  function processScan(raw){
    const v = String(raw || "").replace(/[\r\n\t]+/g, "").trim();

    clearTimeout(scan._t);

  let wedgeBuf = "", wedgeT = 0;
  document.addEventListener("keydown", e => {
    if(isTypingField()) return;
    const now = Date.now();
    if(now - wedgeT > 120) wedgeBuf = "";
    wedgeT = now;
    if(e.key === "Enter" || e.key === "Tab"){
      const v = (wedgeBuf || scan.value || "").trim();
      if(v){ e.preventDefault(); processScan(v); }

  function codeError(code, src){

  /* Detail of a zone: every line in scan order, or totals per code */
  function zoneDetail(z, mode){

  /* Export */
  function stamp(){ const d = new Date(), p = n => String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+"h"+p(d.getMinutes()); }
  function baseName(s){ s = s || state; const m = (s.mission||"inventaire").replace(/[^\p{L}\p{N}_-]+/gu,"_").slice(0,40); return m + "_" + stamp(); }
  function consolidated(s){
    s = s || state; const map = new Map();
    s.lines.forEach(l => { const e = map.get(l.code) || {qty:0, zones:new Set()}; e.qty += l.qty; e.zones.add(l.zone); map.set(l.code, e); });
    return [...map.entries()].map(([code,e]) => [code, e.qty, [...e.zones].join(" ")]);
  }
  function detailRows(s){ return (s || state).lines.map(l => [l.zone, l.code, l.qty, l.src === "manuel" ? "Saisie manuelle" : l.src === "camera" ? "Caméra" : "Scan", l.who || "", new Date(l.t).toLocaleString("fr-FR")]); }
  async function saveFile(filename, data, silent){
    let dl = null; try{ if(window.claude && !silent) dl = await window.claude.use("downloads"); }catch(e){}
    if(!dl && silent && window.claude) return false;
    if(!dl){
      try{
        const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".csv") ? "text/csv" : "application/octet-stream"});
        const file = new File([blob], filename, {type: blob.type || "application/octet-stream"});
        if(!silent && navigator.canShare && navigator.canShare({files:[file]})){
          try{ await navigator.share({files:[file], title: filename}); flash("Fichier partagé : " + filename, "ok"); return true; }
          catch(e){ if(e && e.name === "AbortError"){ flash("Partage annulé : fichier enregistré dans Téléchargements.", ""); } }
        }
        const url = URL.createObjectURL(blob), a = document.createElement("a");
        a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        if(!silent) flash("Fichier enregistré dans Téléchargements : " + filename, "ok");
        return true;
      }catch(e){ flash("Export impossible sur cet appareil.", "bad"); return false; }
    }
    try{ await dl.save({filename, data}); flash("Fichier exporté : " + filename, "ok"); return true; }
    catch(e){ if(e && e.code === "declined") flash("Export annulé.", ""); else flash("Export impossible (" + (e && e.code || "erreur") + ").", "bad"); return false; }
  }
  async function exportXlsx(s, opt){
    s = s || state; opt = opt || {};
    if(!window.XLSX){ if(!opt.silent) flash("Module Excel non chargé : utilise l’export CSV.", "bad"); return false; }
    const wb = XLSX.utils.book_new();
    const d = XLSX.utils.aoa_to_sheet([["Zone","Code","Quantité","Mode","Compteur","Date et heure"], ...detailRows(s)]);
    const M = (s === state || s.useMaster) && master;
    const c = M ? XLSX.utils.aoa_to_sheet([["Code","Désignation","Quantité comptée","Zones"], ...consolidated(s).map(r => [r[0], nameOf(r[0]) || "INCONNU du fichier client", r[1], r[2]])])
                : XLSX.utils.aoa_to_sheet([["Code","Quantité comptée","Zones"], ...consolidated(s)]);
    const j = XLSX.utils.aoa_to_sheet([["Date et heure","Action","Zone","Code","Ancienne quantité","Nouvelle quantité","Compteur"],
      ...(s.log||[]).map(x => [new Date(x.t).toLocaleString("fr-FR"), x.action, x.zone, x.code, x.oldQ, x.newQ, x.who])]);
    j["!cols"] = [{wch:20},{wch:34},{wch:8},{wch:18},{wch:12},{wch:12},{wch:18}];
    fixCodeColJ(j);
    const fixCodeCol = (ws, col) => Object.keys(ws).forEach(k => { if(k[0] !== "!" && new RegExp("^"+col+"\\d+$").test(k)){ ws[k].t = "s"; ws[k].v = String(ws[k].v); ws[k].z = "@"; } });
    fixCodeCol(d,"B"); fixCodeCol(c,"A");
    d["!cols"] = [{wch:8},{wch:18},{wch:10},{wch:16},{wch:18},{wch:20}]; c["!cols"] = M ? [{wch:18},{wch:30},{wch:16},{wch:30}] : [{wch:18},{wch:16},{wch:30}];
    if(M){
      const {ec, syn} = ecartsAoa(s.lines);
      const ws1 = XLSX.utils.aoa_to_sheet(syn); ws1["!cols"] = [{wch:52},{wch:22}]; XLSX.utils.book_append_sheet(wb, ws1, "Synthèse");
      const ws2 = XLSX.utils.aoa_to_sheet(ec); fixCodeCol(ws2, "A"); ws2["!cols"] = [{wch:16},{wch:12},{wch:30},{wch:10},{wch:10},{wch:8},{wch:12},{wch:13},{wch:13},{wch:12},{wch:20}]; XLSX.utils.book_append_sheet(wb, ws2, "Écarts");
    }
    XLSX.utils.book_append_sheet(wb, c, "Consolidé");
    XLSX.utils.book_append_sheet(wb, d, "Détail par zone");
    XLSX.utils.book_append_sheet(wb, j, "Journal");
    const pw = XLSX.utils.aoa_to_sheet(prodAoa(s)); pw["!cols"] = [{wch:10},{wch:9},{wch:8},{wch:16},{wch:16},{wch:17},{wch:9},{wch:9}]; XLSX.utils.book_append_sheet(wb, pw, "Productivité");
    (s.extraSheets || []).forEach(x => { const ws = XLSX.utils.aoa_to_sheet(x.aoa); ws["!cols"] = [{wch:22},{wch:14},{wch:12},{wch:40}]; XLSX.utils.book_append_sheet(wb, ws, x.name); });
    const buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
    const sig = sigOf(s);
    const ok = await saveFile(baseName(s) + (opt.suffix||"") + ".xlsx", new Blob([buf]), opt.silent);
    if(ok && s === state){ state.exportedSig = sig; save(); }
    return ok;
  }
  function fixCodeColJ(ws){ Object.keys(ws).forEach(k => { if(/^D\d+$/.test(k)){ ws[k].t = "s"; ws[k].v = String(ws[k].v); ws[k].z = "@"; } }); }
  async function exportCsv(){
    const rows = [["code","quantite","zones"], ...consolidated()];
    const csv = "\uFEFF" + rows.map(r => r.map(v => { const s = String(v); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(";")).join("\r\n");

  /* Productivity */
  function prodSheet(){
    const tot = missionSpan(state), act = activeMs(state.lines), q = sum(state.lines);
    const zs = state.zones.filter(z => linesOf(z).length || ((state.zoneTimes||{})[z]||[]).length);
    openSheet('<h2>Productivité</h2>'+
      '<div class="totals"><span>PPH réel <b class="num">'+fmtPph(pphReal(q, tot))+'</b></span><span>PPH actif <b class="num">'+fmtPph(pphReal(q, act))+'</b></span></div>'+
      '<div class="totals"><span>Temps total <b class="num">'+fmtDur(tot)+'</b></span><span>Actif <b class="num">'+fmtDur(act)+'</b></span><span>Inactif <b class="num">'+fmtDur(Math.round(tot/60000)*60000 - Math.round(act/60000)*60000)+'</b></span></div>'+
      '<p style="font-size:14px"><b>PPH réel</b> : articles ÷ temps écoulé depuis l’ouverture de la 1re zone, déplacements et temps morts compris, mais le chronomètre s’arrête après 10 min sans activité (c’est celui affiché en haut et à utiliser pour tes devis). <b>PPH actif</b> : seulement pendant le scan, sans les arrêts de plus de 5 min.</p>'+
      (zs.length ? '<div class="zlist">'+zs.map(z => { const zl = linesOf(z), sp = zoneSpan(state, z), a = activeMs(zl);
        return '<div class="zitem'+(z===state.zone?' cur':'')+'"><span class="zn num">'+esc(z)+'</span><span class="zs">'+fmtQty(sum(zl))+' · '+fmtDur(sp)+'<br>PPH réel '+fmtPph(pphReal(sum(zl), sp))+' · actif '+fmtPph(pphReal(sum(zl), a))+'</span></div>'; }).join("")+'</div>' : '')+
      '<p style="font-size:13px">Après 10 min sans scan ni ouverture/fermeture de zone, le temps ne compte plus ; il reprend à l’action suivante.</p>'+
      '<div class="btnrow"><button class="btn" id="pNo">Fermer</button></div>');
    $("pNo").onclick = closeSheet;
  }
  function prodAoa(s){
    const own = s === state, zs = [...new Set(s.lines.map(l => l.zone))].sort();
    const rows = zs.map(z => { const zl = s.lines.filter(l => l.zone === z), sp = zoneSpan(own ? s : {lines:s.lines}, z), a = activeMs(zl);
      return [z, sum(zl), zl.length, Math.round(sp/60000), Math.round(a/60000), Math.round(sp/60000) - Math.round(a/60000), pphReal(sum(zl), sp) ?? "", pphReal(sum(zl), a) ?? ""]; });
    const tot = own ? missionSpan(s) : (s.lines.length ? Math.max(...s.lines.map(l => Date.parse(l.t))) - Math.min(...s.lines.map(l => Date.parse(l.t))) : 0), act = activeMs(s.lines);
    return [["Zone","Articles","Lignes","Temps total (min)","Temps actif (min)","Temps inactif (min)","PPH réel","PPH actif"], ...rows, [],
      ["MISSION", sum(s.lines), s.lines.length, Math.round(tot/60000), Math.round(act/60000), Math.round(tot/60000) - Math.round(act/60000), pphReal(sum(s.lines), tot) ?? "", pphReal(sum(s.lines), act) ?? ""], [],
      ["PPH réel = articles ÷ temps écoulé, temps morts compris mais chaque arrêt plafonné à 10 min. PPH actif = hors arrêts de plus de 5 min."]];
  }

  /* Missions: archive instead of delete */
  function settingsOf(s){ return {prefix:s.prefix, counter:s.counter, confirm:s.confirm, check:s.check, autoBackup:s.autoBackup, bigQty:s.bigQty}; }
  function archiveCurrent(){
    if(!state.lines.length && !(state.log||[]).length) return true;
    const a = loadArch();
    a.unshift({id: Date.now(), mission: state.mission, counter: state.counter, savedAt: new Date().toISOString(), exported: isExported(), data: state});
    while(a.length > MAX_ARCH){ const i = a.map(x => x.exported).lastIndexOf(true); a.splice(i >= 0 ? i : a.length - 1, 1); }
    try{ saveArch(a); return true; }
    catch(e){
      while(a.length > 1){ a.pop(); try{ saveArch(a); return true; }catch(e2){} }
      return false;
    }
  }
  function startNew(){
    if(cam.pending){ beep(false); flash("Valide ou ignore d’abord le code " + cam.pending + ".", "bad"); return; }
    if(!archiveCurrent()){ beep(false); flash("Archivage impossible (mémoire pleine) : exporte, puis supprime des archives.", "bad"); return; }
    const keepS = settingsOf(state); stopTeam(); state = Object.assign(blank(), keepS); loadMaster(); qtyBuf = ""; save(); render(); closeSheet();
    flash("Mission précédente archivée. Nouvelle mission prête : scanne la première zone.", "");

  /* Merge the Excel export of another device */
  function parseFrDate(v){
    if(v instanceof Date) return v.toISOString();
    const m = String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\D+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if(!m) return new Date().toISOString();
    return new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +(m[6]||0)).toISOString();
  }
  function hashStr(s){ let x = 5381; for(let i=0;i<s.length;i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return (x >>> 0).toString(36); }
  function pickMergeFile(){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if(!f) return;
      try{ readMerge(f.name, await f.arrayBuffer()); }
      catch(e){ beep(false); flash("Fichier illisible : choisis l’export Excel de l’autre téléphone.", "bad"); }
    };
    inp.click();
  }
  function readMerge(name, buf){
    if(!window.XLSX){ flash("Module Excel non chargé.", "bad"); return; }
    const wb = XLSX.read(new Uint8Array(buf), {type:"array"});
    const ws = wb.Sheets["Détail par zone"];
    if(!ws){ beep(false); openSheet('<h2>Fichier non reconnu</h2><p>Il faut l’export <b>Excel</b> de l’appli (avec l’onglet « Détail par zone »). Un export CSV ne contient pas les zones.</p><div class="btnrow"><button class="btn primary" id="mfOk">Compris</button></div>'); $("sheet").classList.add("errsheet"); $("mfOk").onclick = closeSheet; return; }
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""});
    const hd = (rows.shift() || []).map(x => String(x).trim());
    const ix = n => hd.indexOf(n);
    const iZ = ix("Zone"), iC = ix("Code"), iQ = ix("Quantité"), iM = ix("Mode"), iW = ix("Compteur"), iT = ix("Date et heure");
    if(iZ < 0 || iC < 0 || iQ < 0){ beep(false); flash("Colonnes Zone, Code ou Quantité introuvables.", "bad"); return; }
    const lines = [];
    rows.forEach(r => {
      const zone = String(r[iZ]||"").trim().toUpperCase(), code = String(r[iC]||"").trim(), qty = parseInt(r[iQ],10);
      if(!zone || !code || !(qty > 0)) return;
      const mode = String(iM >= 0 ? r[iM] : "");
      lines.push({zone, code, qty, src: /manuelle/i.test(mode) ? "manuel" : /cam/i.test(mode) ? "camera" : "scan",
        who: String(iW >= 0 ? r[iW] : "").trim(), t: parseFrDate(iT >= 0 ? r[iT] : "")});
    });
    if(!lines.length){ beep(false); flash("Aucune ligne de comptage dans ce fichier.", "bad"); return; }
    const jws = wb.Sheets["Journal"];
    const jrows = jws ? XLSX.utils.sheet_to_json(jws, {header:1, raw:true, defval:""}).slice(1).filter(r => r[1]) : [];
    const fp = hashStr(lines.map(l => l.zone+"|"+l.code+"|"+l.qty+"|"+l.t).join(";"));
    mergeSheet({name, lines, jrows, fp});
  }
  function mergeSheet(imp, choices){
    choices = choices || {};
    const already = (state.merged || []).find(m => m.fp === imp.fp);
    const zonesImp = [...new Set(imp.lines.map(l => l.zone))].sort();
    const conflicts = zonesImp.filter(z => linesOf(z).length);

    const allChosen = conflicts.every(z => choices[z]);

      return '<div class="cf'+(choices[z] ? ' done' : '')+'"><div class="ct num">'+esc(z)+' comptée sur les deux téléphones</div>'+
        '<div class="cs">Ce téléphone : '+fmtLines(mine.length)+', '+fmtQty(sum(mine))+'<br>Fichier importé : '+fmtLines(theirs.length)+', '+fmtQty(sum(theirs))+'</div>'+
        '<div class="btnrow">'+opt("mine","Garder la mienne")+opt("theirs","Garder l’importée")+'</div><div class="btnrow">'+opt("both","Additionner les deux")+'</div></div>';
    }).join("");
    openSheet('<h2>Fusionner une mission</h2>'+
      (state.team ? '<div class="expst no">Tu es en équipe en ligne : les scans des autres téléphones sont déjà en ligne. Utilise plutôt « Exporter toute l’équipe » pour ne pas les compter deux fois.</div>' : '')+
      (already ? '<div class="expst no">Ce fichier a déjà été fusionné le '+new Date(already.at).toLocaleString("fr-FR")+'. Le fusionner encore doublerait les quantités.</div>' : '')+
      '<p><b>'+esc(imp.name)+'</b><br>Compteur(s) : '+esc(whoImp)+'<br>'+zonesImp.length+' zones · '+fmtLines(imp.lines.length)+' · '+fmtQty(sum(imp.lines))+'</p>'+
      '<p>Zones : <span class="num">'+zonesImp.map(esc).join(" ")+'</span></p>'+
      (conflicts.length ? '<div class="expst no">'+conflicts.length+' zone'+(conflicts.length>1?'s':'')+' en double : choisis pour chacune.</div>'+cf : '<div class="expst ok">Aucune zone en double.</div>')+
      '<div class="btnrow"><button class="btn" id="mgNo">Annuler</button><button class="btn '+(already ? 'danger' : 'primary')+'" id="mgOk"'+(allChosen ? '' : ' disabled style="opacity:.5"')+'>'+(already ? 'Fusionner quand même' : 'Fusionner')+'</button></div>');
    $("sheet").querySelectorAll("[data-cz]").forEach(b => b.onclick = () => { choices[b.dataset.cz] = b.dataset.cv; mergeSheet(imp, choices); });
    $("mgNo").onclick = closeSheet;
    $("mgOk").onclick = () => { if(allChosen) applyMerge(imp, choices, zonesImp); };
  }
  function applyMerge(imp, choices, zonesImp){
    const backup = JSON.stringify(state);
    let added = 0;
    zonesImp.forEach(z => {
      const c = choices[z];
      if(c === "mine") return;
      if(c === "theirs"){ const gone = linesOf(z); logAct("Fusion : zone remplacée par l’import", z, "", sum(gone), sum(imp.lines.filter(l => l.zone === z))); state.lines = state.lines.filter(l => l.zone !== z); }
      imp.lines.filter(l => l.zone === z).forEach(l => { state.lines.push(Object.assign({id: state.seq++}, l)); added++; });
      if(!state.zones.includes(z)) state.zones.push(z);
      if(z !== state.zone) markClosed(z);
    });
    state.log = state.log || [];
    imp.jrows.forEach(r => { state.log.push({t: parseFrDate(r[0]), action: "[importé] " + r[1], zone: String(r[2]||""), code: String(r[3]||""), oldQ: r[4], newQ: r[5], who: String(r[6]||"")}); });
    logAct("Fusion de « " + imp.name + " » : " + fmtLines(added) + " ajoutées", "", "", "", "");
    state.merged = state.merged || []; state.merged.push({fp: imp.fp, file: imp.name, at: new Date().toISOString(), n: added});
    state.zones.sort();
    if(!save()){ state = JSON.parse(backup); render(); return; }
    closeSheet(); render(); beep(true, "zone");
    flash("Fusion réussie : " + fmtLines(added) + " ajoutées. Total mission : " + fmtQty(sum(state.lines)) + ".", "ok");
  }

  /* ===== Stock théorique du client (fichier articles) ===== */
  const MASTER_KEY = "comptage-master";
  let master = null, masterIdx = new Map();
  function normCode(c){ const s = String(c == null ? "" : c).trim().replace(/\s+/g, ""); if(/^\d+$/.test(s)) return s.replace(/^0+/, "") || "0"; return s.toUpperCase(); }
  function parseNum(v){ if(typeof v === "number") return v; const s = String(v == null ? "" : v).replace(/\s| |€/g, "").replace(",", "."); const n = parseFloat(s); return isNaN(n) ? null : n; }
  function rebuildIdx(){
    masterIdx = new Map();
    if(!master) return;
    master.items.forEach((it, i) => {
      it.eans.forEach(e => { const k = normCode(e); if(k && !masterIdx.has(k)) masterIdx.set(k, i); });
      if(it.ref){ const k = normCode(it.ref); if(k && !masterIdx.has(k)) masterIdx.set(k, i); }
    });
  }
  function loadMaster(){
    master = null;
    try{ const m = JSON.parse(localStorage.getItem(MASTER_KEY)); if(m && m.mission === state.startedAt && Array.isArray(m.items)) master = m; }catch(e){}
    rebuildIdx();
  }
  function saveMaster(m){
    try{ if(m) localStorage.setItem(MASTER_KEY, JSON.stringify(m)); else localStorage.removeItem(MASTER_KEY); master = m; rebuildIdx(); return true; }
    catch(e){ beep(false); flash("Fichier trop gros pour la mémoire du téléphone : supprime des missions archivées, puis réessaie.", "bad"); return false; }
  }
  const itemOf = code => { if(!master) return null; const i = masterIdx.get(normCode(code)); return i === undefined ? null : master.items[i]; };
  const nameOf = code => { const it = itemOf(code); return it ? it.name || it.ref || "" : ""; };

  const COLS = [
    {k:"ean", lbl:"Code-barres (EAN)", req:true, re:/(ean|gtin|code.?barre|barcode|upc|cb\b|code ?ean)/i},
    {k:"name", lbl:"Désignation", re:/(d[ée]signation|libell[ée]|nom|produit|article|description)/i},
    {k:"ref", lbl:"Référence", re:/(r[ée]f|sku|code ?article|code ?interne)/i},
    {k:"qty", lbl:"Stock théorique", req:true, re:/(stock|qt[ée]|quantit[ée]|th[ée]orique|disponible|en stock)/i},
    {k:"cost", lbl:"Prix d’achat HT", re:/(prix ?d.?achat|pa\b|p\.a|co[uû]t|pmp|achat)/i}
  ];
  function parseCsv(txt, FS){
    const rows = []; let row = [], cell = "", q = false;
    for(let i = 0; i < txt.length; i++){
      const ch = txt[i];
      if(q){ if(ch === '"'){ if(txt[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
      else if(ch === '"') q = true;
      else if(ch === FS){ row.push(cell); cell = ""; }
      else if(ch === "\n" || ch === "\r"){ if(ch === "\r" && txt[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += ch;
    }
    if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
    return rows;
  }
  function pickMasterFile(){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".xlsx,.xls,.csv,.txt";
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if(!f) return;
      try{
        const buf = new Uint8Array(await f.arrayBuffer());
        let wb;
        if(/\.(csv|txt)$/i.test(f.name)){
          let txt = new TextDecoder("utf-8").decode(buf);
          if(txt.includes("�")) txt = new TextDecoder("windows-1252").decode(buf);
          txt = txt.replace(/^﻿/, "");
          const first = txt.split(/\r?\n/)[0] || "";
          const FS = (first.split(";").length > first.split(",").length) ? ";" : (first.split("\t").length > first.split(",").length ? "\t" : ",");
          wb = {csv: parseCsv(txt, FS)};
        } else wb = XLSX.read(buf, {type:"array"});
        const rows = (wb.csv || XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:""})).filter(r => r.some(v => String(v).trim() !== ""));
        if(rows.length < 2){ beep(false); flash("Fichier vide ou illisible.", "bad"); return; }
        let hi = 0, best = -1;
        rows.slice(0, 10).forEach((r, i) => { const sc = r.filter(v => COLS.some(c => c.re.test(String(v)))).length; if(sc > best){ best = sc; hi = i; } });
        const header = rows[hi].map(v => String(v).trim());
        const map = {};
        COLS.forEach(c => { const i = header.findIndex((h, j) => c.re.test(h) && !Object.values(map).includes(j)); if(i >= 0) map[c.k] = i; });
        mapSheet({file: f.name, header, data: rows.slice(hi + 1), map});
      }catch(e){ beep(false); flash("Fichier illisible : exporte-le en Excel (.xlsx) ou CSV depuis la caisse du client.", "bad"); }
    };
    inp.click();
  }
  function buildItems(imp){
    const m = imp.map, items = [], seen = new Map(); let dup = 0, skipped = 0;
    imp.data.forEach(r => {
      const raw = String(r[m.ean] == null ? "" : r[m.ean]).trim();
      const eans = raw.split(/[,;|\/]+|\s{2,}/).map(x => x.trim().replace(/\s+/g, "")).filter(Boolean)
        .map(x => /^\d+(\.\d+)?e\+?\d+$/i.test(x) ? BigInt(Math.round(parseFloat(x))).toString() : x);
      const ref = m.ref !== undefined ? String(r[m.ref] == null ? "" : r[m.ref]).trim() : "";
      if(!eans.length && !ref){ skipped++; return; }
      const key = normCode(eans[0] || ref);
      const qty = m.qty !== undefined ? (parseNum(r[m.qty]) || 0) : 0;
      if(seen.has(key)){ dup++; items[seen.get(key)].qty += qty; return; }
      seen.set(key, items.length);
      items.push({eans, ref, name: m.name !== undefined ? String(r[m.name] == null ? "" : r[m.name]).trim() : "", qty, cost: m.cost !== undefined ? parseNum(r[m.cost]) : null});
    });
    return {items, dup, skipped};
  }
  function mapSheet(imp){
    const opts = sel => '<option value="">— aucune —</option>' + imp.header.map((h, i) => '<option value="'+i+'"'+(String(sel) === String(i) ? ' selected' : '')+'>'+esc(h || ("Colonne " + (i+1)))+'</option>').join("");
    const b = buildItems(imp);
    const ok = imp.map.ean !== undefined && imp.map.qty !== undefined && b.items.length;
    const sample = b.items.slice(0, 3).map(it => '<div class="dline"><span class="dc num">'+esc(it.eans[0] || it.ref)+'</span><span class="dm">'+esc((it.name || "").slice(0, 22))+'</span><span class="dq num">'+it.qty+'</span></div>').join("");
    openSheet('<h2>Stock théorique du client</h2><p><b>'+esc(imp.file)+'</b> · '+imp.data.length+' lignes</p>'+
      '<p style="font-size:14px">Vérifie quelle colonne correspond à chaque information :</p>'+
      COLS.map(c => '<label>'+c.lbl+(c.req ? ' *' : '')+'<select data-col="'+c.k+'" style="font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">'+opts(imp.map[c.k])+'</select></label>').join("")+
      (b.items.length ? '<p style="font-size:14px">Aperçu ('+b.items.length+' références'+(b.dup ? ', '+b.dup+' doublons additionnés' : '')+') :</p><div class="dlist">'+sample+'</div>' : '<div class="expst no">Aucune référence lue avec ces colonnes.</div>')+
      '<div class="btnrow"><button class="btn" id="mpNo">Annuler</button><button class="btn primary" id="mpOk"'+(ok ? '' : ' disabled style="opacity:.5"')+'>Importer</button></div>');
    $("sheet").querySelectorAll("[data-col]").forEach(s => s.onchange = () => { if(s.value === "") delete imp.map[s.dataset.col]; else imp.map[s.dataset.col] = +s.value; mapSheet(imp); });

    $("mpOk").onclick = () => {
      if(!ok) return;
      if(!state.startedAt){ state.startedAt = new Date().toISOString(); save(); }
      const m = {mission: state.startedAt, file: imp.file, at: new Date().toISOString(), items: b.items};
      if(!saveMaster(m)) return;
      logAct("Import du stock théorique « " + imp.file + " » (" + b.items.length + " réf.)", "", "", "", "");
      save(); render(); closeSheet(); beep(true, "zone");
      flash("Stock théorique chargé : " + b.items.length + " références. Les noms s’affichent maintenant au scan.", "ok");
    };
  }
  /* Compare counted lines with the client's file */
  function computeEcarts(lines){
    const cnt = new Map(), unk = new Map();
    lines.forEach(l => {
      const k = normCode(l.code), i = masterIdx.get(k);
      const tgt = i === undefined ? unk : cnt, key = i === undefined ? k : i;
      const e = tgt.get(key) || {qty:0, zones:new Set(), code:l.code}; e.qty += l.qty; e.zones.add(l.zone); tgt.set(key, e);
    });
    const rows = master.items.map((it, i) => {
      const c = cnt.get(i) || {qty:0, zones:new Set()};
      const ec = c.qty - it.qty, cost = it.cost;
      return {code: it.eans[0] || it.ref, ref: it.ref, name: it.name, th: it.qty, ct: c.qty, ec, cost, vth: cost == null ? null : it.qty * cost, vct: cost == null ? null : c.qty * cost, vec: cost == null ? null : ec * cost, zones: [...c.zones].sort().join(" "), unknown:false};
    });
    unk.forEach(e => rows.push({code: e.code, ref:"", name:"INCONNU du fichier client", th:0, ct:e.qty, ec:e.qty, cost:null, vth:null, vct:null, vec:null, zones:[...e.zones].sort().join(" "), unknown:true}));
    const tot = {th:0, ct:0, vth:0, vct:0, hasCost:false, refsEc:0, unknown:unk.size, missing:0, extra:0};
    rows.forEach(r => { tot.th += r.th; tot.ct += r.ct; if(r.vth != null){ tot.hasCost = true; tot.vth += r.vth; tot.vct += r.vct; } if(r.ec){ tot.refsEc++; if(r.ec < 0) tot.missing++; else tot.extra++; } });
    return {rows, tot};
  }
  const fmtEur = v => v == null ? "—" : v.toLocaleString("fr-FR", {style:"currency", currency:"EUR"});
  const sgn = n => (n > 0 ? "+" : "") + (Math.round(n * 100) / 100).toLocaleString("fr-FR");
  function ecartsSheet(filter){
    if(!master){ masterSheet(); return; }
    filter = filter || "ec";
    const {rows, tot} = computeEcarts(state.lines);
    let list = rows.filter(r => filter === "all" ? true : filter === "unk" ? r.unknown : filter === "miss" ? r.ec < 0 : filter === "plus" ? (r.ec > 0 && !r.unknown) : r.ec !== 0);
    list.sort((a, b) => (Math.abs(b.vec || 0) - Math.abs(a.vec || 0)) || (Math.abs(b.ec) - Math.abs(a.ec)));
    const shown = list.slice(0, 150);
    const seg = (v, l) => '<button class="'+(filter === v ? 'on' : '')+'" data-f="'+v+'">'+l+'</button>';
    openSheet('<h2>Écarts</h2>'+
      '<div class="totals"><span>Théorique <b class="num">'+tot.th+'</b></span><span>Compté <b class="num">'+tot.ct+'</b></span><span>Écart <b class="num">'+sgn(tot.ct - tot.th)+'</b></span></div>'+
      (tot.hasCost ? '<div class="totals"><span>Valeur théorique <b class="num">'+fmtEur(tot.vth)+'</b></span><span>Écart <b class="num" style="color:'+(tot.vct - tot.vth < 0 ? 'var(--bad)' : 'var(--ok)')+'">'+fmtEur(tot.vct - tot.vth)+'</b></span></div>' : '')+

      const needWho = () => { const w = $("tWho").value.trim(); if(!w){ beep(false); flash("Indique ton nom : l’équipe verra qui a compté quoi.", "bad"); $("tWho").focus(); return false; } state.counter = w; save(); render(); return true; };
      $("tCreate").onclick = () => { if(needWho()) createTeam(); };
      $("tJoin").onclick = () => { if(needWho()) joinTeam($("tCode").value); };
      $("tBack").onclick = () => $("menuBtn").click();
      return;
    }
    const devs = Object.entries(teamDevices).map(([id, d]) =>
      '<div class="zitem"><span class="zs" style="color:var(--ink)"><b>'+esc(id === deviceId ? (state.counter || "Ce téléphone") + " (ce téléphone)" : (d.who || "Appareil " + id))+'</b><br>'+
      (id === deviceId ? fmtLines(state.lines.length) + " · " + fmtQty(sum(state.lines)) : fmtLines(d.lines || 0) + " · " + fmtQty(d.qty || 0) + " · vu " + (d.at ? new Date(d.at).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}) : "?"))+'</span></div>').join("");
    const t = teamTotals();
    openSheet('<h2>Équipe en ligne</h2>'+
      '<p>Code mission à donner à ton collègue :</p><div class="num" style="font-size:44px;font-weight:700;letter-spacing:6px;text-align:center;background:var(--tag);color:var(--tagInk);border-radius:12px;padding:6px">'+esc(state.team.code)+'</div>'+
      '<div class="totals"><span><b class="num">'+t.devs+'</b> appareils</span><span><b class="num">'+t.q+'</b> articles</span></div>'+
      '<div class="team '+(lastErr ? 'err' : 'ok')+'" style="display:block">'+esc(lastErr || (navigator.onLine ? (inflight ? "Envoi en cours…" : "Tout est synchronisé.") : "Hors ligne : les scans partiront au retour du réseau."))+'</div>'+
      (devs ? '<div class="zlist">'+devs+'</div>' : '')+
      '<div class="btnrow"><button class="btn primary" id="tExp">Exporter toute l’équipe (Excel)</button></div>'+
      '<div class="btnrow"><button class="btn" id="tSync">Resynchroniser</button><button class="btn" id="tLeave">Quitter l’équipe</button></div>'+
      '<p style="font-size:14px">Après remise du rapport au client, supprime les données en ligne : elles restent sur les téléphones et dans tes exports.</p>'+
      '<div class="btnrow"><button class="btn danger" id="tDel">Supprimer les données en ligne</button></div>'+
      '<div class="btnrow"><button class="btn" id="tBack">Retour</button></div>');
    $("tExp").onclick = exportTeam;
    $("tSync").onclick = () => { lastErr = ""; flash("Resynchronisation…", ""); reconcile().then(() => { flash("Resynchronisation faite.", "ok"); teamSheet(); }).catch(e => flash(errMsg(e), "bad")); };
    $("tLeave").onclick = leaveTeam;
    $("tDel").onclick = () => confirmSheet("Supprimer les données en ligne ?", "Tous les scans de l’équipe pour la mission " + state.team.code + " seront effacés du serveur, pour tous les téléphones. Exporte toute l’équipe AVANT.", "Supprimer en ligne", deleteOnline);
    $("tBack").onclick = () => $("menuBtn").click();
  }

  /* Keep the screen on while counting, and ask Android not to clear storage */
  let wakeLock = null;
  async function keepAwake(){ try{ if("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") keepAwake(); });
  keepAwake();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

  /* Camera scanning */
  /* A code must be read on 2 frames in a row, then waits for "Valider".
     After that, the same code is ignored until it has left the frame for about 1 second. */
  const cam = {on:false, stream:null, timer:null, detector:null, zx:null, torch:false, pending:"", block:"", cand:"", candN:0, misses:0};
  function onCamCode(code){
    code = String(code || "").trim(); if(!code || !cam.on) return;
    cam.misses = 0;
    if(cam.pending || code === cam.block) return;
    if(code !== cam.cand){ cam.cand = code; cam.candN = 1; return; }
    if(++cam.candN < 2) return;
    cam.cand = ""; cam.candN = 0;
    if(zoneRegex().test(code)) cam.block = code;
    receiveScan(code, "camera");
  }
  /* Every article scan (scanner or camera) waits for "Valider" when the option is on */
  let lastScan = {code:"", t:0};
  function receiveScan(raw, src){
    const code = String(raw).replace(/\s+/g, "");
    if(!code || sheetOpen) return;
    const now = Date.now();
    if(src === "scan" && code === lastScan.code && now - lastScan.t < 500){ lastScan.t = now; return; }
    lastScan = {code, t: now};
    if(state.finished){ missionClosedError(code); return; }
    if(cam.pending){ beep(false); flash("Valide ou ignore d’abord le code " + cam.pending + ".", "bad"); return; }
    if(zoneRegex().test(code) || !state.zone || state.confirm === false){ handleCode(code, src); return; }
    if(state.check !== false && !eanValid(code)){ codeError(code, src); return; }
    cam.pending = code; cam.psrc = src;
    if(master && !itemOf(code)){ beep(false); showPending(); flash("Attention : code inconnu du fichier client. Vérifie l’article avant de valider.", "bad"); return; }
    beep(true); showPending();
    flash("Code lu : tape la quantité si besoin, puis « Valider ».", "");
  }
  function onCamMiss(){
    if(++cam.misses >= 8){ cam.block = ""; cam.cand = ""; cam.candN = 0; }
  }
  function camValidate(){
    if(!cam.pending) return;
    const c = cam.pending, s = cam.psrc || "scan"; cam.pending = "";
    if(s === "camera"){ cam.block = c; cam.misses = 0; }
    handleCode(c, s); showPending(); focusScan();
  }
  function camSkip(){
    if(!cam.pending) return;
    if(cam.psrc === "camera"){ cam.block = cam.pending; cam.misses = 0; }
    cam.pending = ""; qtyBuf = ""; renderQty(); focusScan();
    flash("Code ignoré.", "");
  }
  function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  async function startCam(){
    if(cam.on) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ flash("Caméra indisponible sur cet appareil.", "bad"); return; }
    try{
      cam.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
    }catch(e){
      flash(e && e.name === "NotAllowedError" ? "Accès à la caméra refusé : autorise-le dans les réglages de l’appli." : "Impossible d’ouvrir la caméra.", "bad");
      return;
    }
    const v = $("camVideo"); v.srcObject = cam.stream;
    try{ await v.play(); }catch(e){}
    cam.on = true; cam.torch = false; cam.block = ""; cam.cand = ""; cam.candN = 0;
    $("cam").classList.add("on"); $("list").style.display = "none"; $("camBtn").textContent = "Arrêter";
    $("torchBtn").textContent = "Lampe";
    try{ const t = cam.stream.getVideoTracks()[0]; const caps = t.getCapabilities ? t.getCapabilities() : {}; $("torchBtn").hidden = !caps.torch; }catch(e){ $("torchBtn").hidden = true; }
    cam.detector = null;
    if("BarcodeDetector" in window){
      try{
        const want = ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code","data_matrix"];
        const sup = await BarcodeDetector.getSupportedFormats();
        const formats = want.filter(f => sup.includes(f));
        if(formats.length) cam.detector = new BarcodeDetector({formats});
      }catch(e){ cam.detector = null; }
    }
    if(cam.detector){
      const loop = async () => {
        if(!cam.on) return;
        try{ if(v.readyState >= 2){ const r = await cam.detector.detect(v); if(r && r.length) onCamCode(r[0].rawValue); else onCamMiss(); } }catch(e){}
        if(cam.on) cam.timer = setTimeout(loop, 120);
      };
      loop();
    } else {
      try{ if(!window.ZXing) await loadScript("zxing.min.js"); }catch(e){ flash("Lecteur de codes non chargé : réessaie avec internet.", "bad"); stopCam(); return; }
      try{
        const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
        cam.zx = new ZXing.BrowserMultiFormatReader(hints, 150);
        cam.zx.decodeFromStream(cam.stream, v, (result) => { if(!cam.on) return; if(result) onCamCode(result.getText()); else onCamMiss(); }).catch(() => {});
      }catch(e){ flash("Lecture caméra impossible sur cet appareil.", "bad"); stopCam(); return; }
    }
    flash("Caméra active : vise un code-barres.", "");
    focusScan();
  }
  function stopCam(){
    cam.on = false; clearTimeout(cam.timer);
    cam.block = ""; cam.cand = ""; cam.candN = 0; showPending();
    try{ if(cam.zx) cam.zx.reset(); }catch(e){}
    cam.zx = null;
    if(cam.stream){ cam.stream.getTracks().forEach(t => t.stop()); cam.stream = null; }
    $("camVideo").srcObject = null;
    $("cam").classList.remove("on"); $("list").style.display = ""; $("camBtn").textContent = "Caméra";
    focusScan();
  }
  $("camOk").addEventListener("click", camValidate);
  $("camSkip").addEventListener("click", camSkip);
  ["camBtn","camClose","torchBtn","camOk","camSkip"].forEach(id => $(id).addEventListener("pointerdown", e => e.preventDefault()));
  $("camBtn").addEventListener("click", () => { cam.on ? stopCam() : startCam(); });
  $("camClose").addEventListener("click", stopCam);
  $("torchBtn").addEventListener("click", async () => {
    const t = cam.stream && cam.stream.getVideoTracks()[0]; if(!t) return;
    cam.torch = !cam.torch;
    try{ await t.applyConstraints({advanced:[{torch: cam.torch}]}); $("torchBtn").textContent = cam.torch ? "Lampe off" : "Lampe"; }
    catch(e){ cam.torch = false; }
  });
  document.addEventListener("visibilitychange", () => { if(document.hidden && cam.on) stopCam(); });

  if(!state.startedAt){ state.startedAt = new Date().toISOString(); save(); }
  loadMaster();
  render(); focusScan(); teamBoot();
  if(state.zone){ const n = linesOf(state.zone).length; flash("Zone " + state.zone + " en cours : " + fmtLines(n) + " déjà comptée" + (n>1?"s":"") + ".", "zone"); }
  setInterval(updateStatus, 1500);
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
